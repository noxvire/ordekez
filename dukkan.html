<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeynep'in Oyun Dükkânı</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e8e2d0;font-family:"Courier New",ui-monospace,monospace}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
  .hidden{display:none!important}
  .px{image-rendering:pixelated}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:2}
  #cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#e8e2d0;opacity:.8;box-shadow:0 0 0 1px #000}
  #cross.on{width:8px;height:8px;margin:-4px 0 0 -4px;background:none;border:2px solid #ffd870}
  #prompt{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:15px;font-weight:700;color:#fff;text-shadow:2px 2px 0 #000;white-space:nowrap}
  #prompt kbd{display:inline-block;border:2px solid #fff;padding:0 5px;margin-right:6px;font-family:inherit;background:rgba(0,0,0,.4)}
  #clock{position:absolute;right:18px;top:14px;text-align:right;text-shadow:2px 2px 0 #000}
  #clock b{display:block;font-size:30px;letter-spacing:2px;color:#ff5a3a;font-family:"Courier New",monospace}
  #clock span{font-size:13px;opacity:.85}
  #money{position:absolute;left:18px;top:14px;font-size:20px;font-weight:700;color:#9ee870;text-shadow:2px 2px 0 #000}
  #order{position:absolute;left:18px;top:48px;max-width:300px;background:#efe6c8;color:#2a2010;padding:10px 12px;font-size:14px;line-height:1.35;transform:rotate(-1.5deg);box-shadow:3px 3px 0 rgba(0,0,0,.6)}
  #order b{display:block;font-size:11px;letter-spacing:2px;opacity:.6;margin-bottom:3px}
  #held{position:absolute;right:18px;bottom:18px;font-size:14px;text-shadow:2px 2px 0 #000;opacity:.9}
  #hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:14px;background:rgba(0,0,0,.55);padding:6px 12px;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
  #toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:18px;font-weight:700;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}
  #toast.on{opacity:1}
  /* diyalog */
  #dlg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(760px,94vw);display:flex;gap:14px;background:rgba(8,8,12,.88);border:2px solid #e8e2d0;padding:12px;z-index:5}
  #dlg canvas{width:96px;height:114px;border:2px solid #555;flex:none;background:#111}
  #dlg .t{flex:1;display:flex;flex-direction:column;gap:6px}
  #dlg .nm{font-size:14px;font-weight:700;color:#ffd870;letter-spacing:1px}
  #dlg .tx{font-size:17px;line-height:1.4;min-height:48px}
  #dlg .ch{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  #dlg .ch button{font:inherit;font-size:15px;text-align:left;background:none;color:#e8e2d0;border:1px solid rgba(255,255,255,.25);padding:5px 9px;cursor:pointer}
  #dlg .ch button:hover,#dlg .ch button.sel{background:#e8e2d0;color:#111}
  #dlg .more{font-size:12px;opacity:.6;align-self:flex-end}
  /* kasa */
  #till{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);background:#1b1d1a;border:3px solid #6f7a5a;box-shadow:0 0 0 4px #000,0 20px 60px #000;padding:16px;z-index:6;color:#cfe8b0}
  #till h3{font-size:16px;letter-spacing:3px;margin-bottom:8px;color:#9ee870}
  #till .scr{background:#0b1408;border:2px solid #2d3a20;padding:10px;font-size:15px;line-height:1.5;margin-bottom:10px}
  #till .scr .row{display:flex;justify-content:space-between}
  #till .scr .big{font-size:20px;color:#d4ff9a}
  #till .bills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  #till .bills button,#till .act button{font:inherit;font-size:15px;font-weight:700;padding:9px 4px;background:#2c3326;color:#e9ffd0;border:2px solid #56664a;cursor:pointer}
  #till .bills button:hover,#till .act button:hover{background:#3d4a33}
  #till .act{display:flex;gap:8px}
  #till .act button{flex:1}
  #till .act .ok{background:#3c6a2a;border-color:#7ac35a}
  #till .msg{min-height:20px;font-size:14px;color:#ffb070;margin-top:6px}
  /* kâğıt */
  #paper{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);width:min(460px,92vw);background:#eadfbf;color:#2c2210;padding:26px 28px;z-index:6;box-shadow:6px 6px 0 rgba(0,0,0,.6);font-size:16px;line-height:1.55}
  #paper h3{font-size:18px;text-align:center;margin-bottom:12px;letter-spacing:2px}
  #paper ol{padding-left:22px}
  #paper li{margin-bottom:6px}
  #paper small{display:block;text-align:center;margin-top:14px;opacity:.6}
  #paper .sig{text-align:right;font-style:italic;margin-top:10px}
  /* menüler */
  .scrn{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.72);text-align:center;padding:20px}
  .scrn h1{font-size:clamp(28px,6vw,58px);letter-spacing:4px;color:#ffd870;text-shadow:4px 4px 0 #6a1a10,0 0 30px rgba(255,120,40,.35);line-height:1.05}
  .scrn h1 small{display:block;font-size:.35em;letter-spacing:8px;color:#e8e2d0;text-shadow:2px 2px 0 #000;margin-top:8px}
  .scrn h2{font-size:28px;letter-spacing:4px;color:#ffd870;text-shadow:3px 3px 0 #000}
  .scrn p{max-width:640px;font-size:16px;line-height:1.55}
  .mbtn{font:inherit;font-size:18px;font-weight:700;letter-spacing:2px;min-width:260px;padding:10px 20px;background:rgba(20,18,14,.9);color:#e8e2d0;border:2px solid #e8e2d0;cursor:pointer}
  .mbtn:hover,.mbtn.sel{background:#e8e2d0;color:#111}
  .mbtn:disabled{opacity:.35;cursor:default}
  #menu{position:fixed;inset:0;z-index:8;background:#0a0612;overflow:hidden}
  #menu .stage{position:absolute;left:50%;top:50%;width:max(100vw,177.68vh);aspect-ratio:1672/941;transform:translate(-50%,-50%);background:url(dk_menu.jpg) center/100% 100% no-repeat;container-type:size}
  #menu .stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
  #mItems{position:absolute;left:4.37%;top:47.1%;width:24.8%}
  .mi2{position:relative;display:flex;align-items:center;height:7.2cqh;padding-left:4.3cqw;font:700 3.25cqh/1 "Courier New",ui-monospace,monospace;letter-spacing:.08em;color:#e4dbe6;text-shadow:0 0 .4cqh rgba(0,0,0,.9);cursor:pointer;border:.3cqh solid transparent;margin-bottom:-.3cqh;user-select:none}
  .mi2.sel{border-color:#9f8cff;background:linear-gradient(90deg,rgba(70,40,160,.55),rgba(40,20,90,.35));box-shadow:0 0 1.4cqh rgba(130,110,255,.55),inset 0 0 1cqh rgba(130,110,255,.35)}
  .mi2.sel::before{content:"▶";position:absolute;left:1.3cqw;font-size:2.4cqh;color:#e4dbe6}
  .mi2 small{font-size:1.7cqh;opacity:.6;margin-left:1cqw;letter-spacing:0}
  #mPanel{position:absolute;left:4.37%;top:40%;width:30%;padding:2.4cqh 2cqw;background:rgba(14,8,28,.92);border:.3cqh solid #9f8cff;box-shadow:0 0 2cqh rgba(130,110,255,.4);font-size:2.1cqh;line-height:1.6;color:#e4dbe6}
  #mPanel h3{font-size:2.6cqh;letter-spacing:.2em;margin-bottom:1.4cqh;color:#c8bcff}
  #mPanel label{display:flex;justify-content:space-between;align-items:center;gap:1cqw;margin:1cqh 0}
  #mPanel input{width:55%}
  #mPanel .k{display:grid;grid-template-columns:auto 1fr;gap:.6cqh 1.6cqw}
  #mPanel .k b{color:#ffd870}
  #mPanel button{font:inherit;font-size:2cqh;margin-top:1.6cqh;padding:.8cqh 1.6cqw;background:rgba(70,40,160,.5);color:#fff;border:.25cqh solid #9f8cff;cursor:pointer}
  #sum{justify-content:flex-start;overflow-y:auto;padding-top:28px}
  #sum .tbl{font-size:16px;line-height:1.7;min-width:320px;text-align:left;background:rgba(0,0,0,.5);border:2px solid #555;padding:12px 18px}
  #sum .tbl div{display:flex;justify-content:space-between;gap:30px}
  #sum .tbl .neg{color:#ff7a5a}
  #sum .tbl .tot{border-top:2px solid #777;margin-top:6px;padding-top:6px;font-weight:700}
  #sum .cols{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  #sum .shop{background:rgba(0,0,0,.5);border:2px solid #555;padding:12px;max-width:520px;text-align:left}
  #sum .shop h4{font-size:14px;letter-spacing:2px;margin:4px 0 6px;color:#ffd870}
  #sum .shop .it{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
  #sum .shop .it small{opacity:.6;display:block;font-size:12px}
  #sum .shop button{font:inherit;font-size:13px;font-weight:700;padding:4px 10px;background:#2c3326;color:#e9ffd0;border:1px solid #6f7a5a;cursor:pointer;white-space:nowrap}
  #sum .shop button:disabled{opacity:.35;cursor:default}
  #sum .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  #fade{position:fixed;inset:0;background:#000;z-index:9;opacity:0;pointer-events:none;transition:opacity .8s}
  #fade.on{opacity:1}
  #title{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:7;font-size:clamp(26px,5vw,48px);letter-spacing:6px;color:#e8e2d0;text-shadow:3px 3px 0 #000;opacity:0;transition:opacity 1s;pointer-events:none}
  #title small{display:block;font-size:.4em;letter-spacing:4px;opacity:.75;margin-top:8px}
  #title.on{opacity:1}
  #scare{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;pointer-events:none}
  #scare canvas{height:110vh;image-rendering:pixelated;filter:contrast(1.6) saturate(.4);animation:shk .08s infinite}
  @keyframes shk{0%{transform:translate(-8px,4px) scale(1.05)}50%{transform:translate(7px,-5px) scale(1.08)}100%{transform:translate(-3px,6px) scale(1.04)}}
  #mob{position:fixed;inset:auto 0 0 0;padding:8px;font-size:12px;text-align:center;background:#311;z-index:11}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="money"></div>
  <div id="clock"><b>22:00</b><span></span></div>
  <div id="order" class="hidden"><b>SİPARİŞ</b><span></span></div>
  <div id="held"></div>
  <div id="hint" class="hidden"></div>
  <div id="toast"></div>
</div>

<div id="dlg" class="hidden">
  <canvas width="64" height="76" class="px"></canvas>
  <div class="t"><div class="nm"></div><div class="tx"></div><div class="ch"></div><div class="more">E / tıkla ▶</div></div>
</div>

<div id="till" class="hidden">
  <h3>▣ KASA</h3>
  <div class="scr"></div>
  <div class="bills"></div>
  <div class="act"><button id="tClr">Temizle</button><button id="tCancel">Vazgeç</button><button id="tOk" class="ok">Para üstünü ver ▶</button></div>
  <div class="msg"></div>
</div>

<div id="paper" class="hidden"></div>

<div id="menu">
  <div class="stage">
    <div id="mItems"></div>
    <div id="mPanel" class="hidden"></div>
  </div>
</div>

<div id="pause" class="scrn hidden">
  <h2>DURAKLATILDI</h2>
  <button class="mbtn" data-p="go">Devam</button>
  <button class="mbtn" data-p="rules">Dayının Kuralları</button>
  <button class="mbtn" data-p="menu">Ana Menü</button>
  <label style="font-size:14px">Ses <input type="range" id="vol" min="0" max="1" step=".05" value=".8"></label>
  <label style="font-size:14px">Fare hassasiyeti <input type="range" id="sens" min=".3" max="2.5" step=".1" value="1"></label>
</div>

<div id="sum" class="scrn hidden"></div>
<div id="title"></div>
<div id="fade"></div>
<div id="scare" class="hidden"><canvas width="64" height="76"></canvas></div>
<div id="mob" class="hidden">Bu oyun klavye ve fare ile oynanır 🙏 Bilgisayardan gir.</div>

<script type="module">
import * as THREE from './three-uzay.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a), pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
if (matchMedia('(pointer: coarse)').matches) $('mob').classList.remove('hidden');

/* =====================================================================
   PSX GÖRÜNÜMÜ: düşük çözünürlük + köşe titremesi + renk kısma + dither
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
let LW = 400, LH = 240;
const rt = new THREE.WebGLRenderTarget(LW, LH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const SNAP = new THREE.Vector2(160, 100);
const postMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: rt.texture }, res: { value: new THREE.Vector2(LW, LH) }, time: { value: 0 }, glitch: { value: 0 }, dark: { value: 0 }, red: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tex; uniform vec2 res; uniform float time, glitch, dark, red; varying vec2 vUv;
    float bayer(vec2 p){ int x = int(mod(p.x, 4.)), y = int(mod(p.y, 4.));
      float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.); return m[x + y * 4] / 16.; }
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      if (glitch > 0.) { float l = floor(uv.y * res.y / 3.); float n = h(vec2(l, floor(time * 24.)));
        if (n < glitch * .6) uv.x += (n - .3) * glitch * .2; }
      vec3 c = texture2D(tex, uv).rgb;
      if (glitch > 0.) { c.r = texture2D(tex, uv + vec2(glitch * .01, 0.)).r; c.b = texture2D(tex, uv - vec2(glitch * .01, 0.)).b; }
      c = pow(max(c, 0.), vec3(1. / 2.2));
      vec2 p = floor(uv * res);
      c = floor(c * 26. + bayer(p)) / 26.;
      vec2 q = uv - .5; c *= 1. - dot(q, q) * 1.15;
      c += (h(p + fract(time) * 91.) - .5) * .035;
      c *= .93 + .07 * step(.5, fract(gl_FragCoord.y * .5));
      c = mix(c, vec3(c.r * 1.4 + .05, c.g * .25, c.b * .25), red);
      c *= 1. - dark;
      gl_FragColor = vec4(c, 1.);
    }`
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

function psx(m) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uSnap = { value: SNAP };
    sh.vertexShader = 'uniform vec2 uSnap;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  gl_Position.xy = floor(gl_Position.xy / gl_Position.w * uSnap + .5) / uSnap * gl_Position.w;');
  };
  return m;
}
function ctex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  t.userData.canvas = c; return t;
}
const lam = o => psx(new THREE.MeshLambertMaterial(typeof o === 'object' && !o.isColor && !o.isTexture ? o : (o && o.isTexture ? { map: o } : { color: o })));
const basic = o => psx(new THREE.MeshBasicMaterial(o));

/* ---------- dokular ---------- */
const noiseFill = (g, w, h, base, amt, n = 300) => { g.fillStyle = base; g.fillRect(0, 0, w, h); for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},${Math.random() * amt})`; g.fillRect(Math.random() * w | 0, Math.random() * h | 0, 1 + (Math.random() * 2 | 0), 1); } };
const TX = {
  floor: ctex(32, 32, (g, w, h) => { for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? '#2b2a26' : '#8b8576'; g.fillRect(x * 16, y * 16, 16, 16); }
    for (let i = 0; i < 120; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .25})`; g.fillRect(Math.random() * w | 0, Math.random() * h | 0, 2, 1); } }, [10, 8]),
  wall: ctex(32, 32, (g, w, h) => { noiseFill(g, w, h, '#3c4a3a', .18, 200); for (let x = 0; x < w; x += 8) { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x, 0, 2, h); }
    g.fillStyle = 'rgba(60,40,10,.25)'; g.fillRect(0, 26, w, 6); }, [6, 2]),
  ceil: ctex(32, 32, (g, w, h) => { noiseFill(g, w, h, '#8c877a', .15, 120); g.fillStyle = '#4a463e'; g.fillRect(0, 0, w, 1); g.fillRect(0, 0, 1, h); g.fillStyle = 'rgba(90,60,20,.35)'; g.beginPath(); g.arc(20, 18, 5, 0, 7); g.fill(); }, [10, 8]),
  wood: ctex(32, 16, (g, w, h) => { noiseFill(g, w, h, '#5a3a22', .2, 160); for (let y = 0; y < h; y += 4) { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, y, w, 1); } }, [2, 1]),
  woodD: ctex(32, 16, (g, w, h) => { noiseFill(g, w, h, '#3a2416', .2, 160); for (let y = 0; y < h; y += 4) { g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, y, w, 1); } }),
  metal: ctex(16, 16, (g, w, h) => noiseFill(g, w, h, '#6a6e72', .12, 60)),
  box: ctex(32, 32, (g, w, h) => { noiseFill(g, w, h, '#a07a48', .15, 120); g.fillStyle = '#c9a46a'; g.fillRect(0, 14, w, 4); }),
  street: ctex(128, 64, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#05070e'); gr.addColorStop(.55, '#0c1020'); gr.addColorStop(1, '#16141a'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#0a0b10'; g.fillRect(0, 14, 34, 34); g.fillRect(84, 8, 44, 40); g.fillRect(40, 22, 30, 26);
    for (let i = 0; i < 9; i++) { g.fillStyle = Math.random() < .3 ? '#d8b860' : '#1a1d28'; g.fillRect(4 + (i % 3) * 9, 18 + ((i / 3) | 0) * 9, 5, 5); }
    g.fillStyle = '#d8b860'; g.fillRect(96, 16, 5, 6); g.fillStyle = '#1a1d28'; g.fillRect(108, 16, 5, 6); g.fillRect(96, 28, 5, 6);
    g.fillStyle = '#26232a'; g.fillRect(0, 48, w, 16); g.fillStyle = '#3a3640'; g.fillRect(0, 48, w, 2);
    g.fillStyle = '#ffb860'; g.fillRect(74, 18, 2, 30); g.fillStyle = 'rgba(255,190,90,.35)'; g.beginPath(); g.arc(75, 18, 9, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,190,90,.12)'; g.beginPath(); g.ellipse(75, 52, 20, 4, 0, 0, 7); g.fill();
  }),
};
function signTex(text, bg, fg, w = 96, h = 20) {
  return ctex(w, h, (g) => { g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.font = `bold ${h - 6}px monospace`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 1); });
}
function posterTex(title, emoji, bg, sub) {
  return ctex(48, 72, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, bg); gr.addColorStop(1, '#100c10'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.font = '30px serif'; g.textAlign = 'center'; g.fillText(emoji, w / 2, 40);
    g.fillStyle = '#ffe9a0'; g.font = 'bold 8px monospace'; title.split('\n').forEach((l, i) => g.fillText(l, w / 2, 54 + i * 8));
    if (sub) { g.fillStyle = '#ff5a3a'; g.font = 'bold 6px monospace'; g.fillText(sub, w / 2, 9); }
    g.strokeStyle = '#000'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
  });
}

/* =====================================================================
   OYUNLAR (ürünler)

function walk(c, dt) {

  if (keys.KeyA || keys.ArrowLeft) fx -= 1; if (keys.KeyD || keys.ArrowRight) fx += 1;

    </div>
    <div class="shop"><h4>STOK SİPARİŞİ (yarın gelir)</h4><div class="grid">${Object.keys(GAMES).map(id => `<div class="it"><span>${GAMES[id].e} ${GAMES[id].ad}<small>Rafta ${S.stock[id]} · ${Math.round(GAMES[id].p * .5)} ₺/adet</small></span><span><button data-o="${id}" data-d="-1">−</button> <b>${order[id] || 0}</b> <button data-o="${id}" data-d="1">+</button></span></div>`).join('')}</div>
      <h4 style="margin-top:10px">DÜKKÂNI GELİŞTİR</h4>${UPG.map(u => `<div class="it"><span>${u.ad}<small>${u.d}</small></span>${S.upg[u.id] ? '<b style="color:#9ee870">✓</b>' : `<button data-u="${u.id}" ${S.money - cost < u.p ? 'disabled' : ''}>${u.p} ₺</button>`}</div>`).join('')}
    </div></div>
    <p>Sipariş tutarı: <b>${cost} ₺</b> · Kalan: <b>${S.money - cost} ₺</b></p>
    <button class="mbtn" id="bNext" ${S.money - cost < 0 ? 'disabled' : ''}>GECE ${S.night + 1}'E BAŞLA ▶</button>
    <button class="mbtn" id="bSumMenu" style="min-width:180px;font-size:14px">Kaydet ve Ana Menü</button>`;
  el.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const id = b.dataset.o; order[id] = Math.max(0, Math.min(8, (order[id] || 0) + +b.dataset.d)); SND.click(); renderSum(); });
  el.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const u = UPG.find(x => x.id === b.dataset.u); S.money -= u.p; S.upg[u.id] = 1; SND.drawer(); renderSum(); });
  const commit = () => { const c = Object.entries(order).reduce((s, [id, q]) => s + q * Math.round(GAMES[id].p * .5), 0); S.money -= c; for (const [id, q] of Object.entries(order)) S.stock[id] += q; order = {}; S.night++; writeSave(); };

  $('bSumMenu').onclick = () => { commit(); showMenu(); };
}
function showEnding() {

  el.innerHTML += `<div class="tbl"><div><span>Kasa</span><span>${S.money} ₺</span></div><div><span>Reddedilen taklitçi</span><span>${S.fakeRefused}</span></div><div><span>Lanet</span><span>${'☠'.repeat(Math.min(6, S.lanet)) || '—'}</span></div>${relTxt ? `<div style="font-size:13px"><span>${relTxt}</span></div>` : ''}</div>
    <button class="mbtn" id="bEndMenu">Ana Menü</button>`;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}

function submitScore(good) {

  if (!token) return;
  fetch('https://servvglgsudtjouqknvx.supabase.co/rest/v1/rpc/skor_kaydet', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_LGSMfulqXck-aU3N37Fc0g_zeJQ239J' },
    body: JSON.stringify({ p_token: token, p_oyun: 'dukkan', p_deger: Math.max(0, Math.min(99999, S.money)), p_detay: { son: good ? 'iyi' : 'kötü', lanet: S.lanet } }) }).catch(() => {});
}

/* =====================================================================
   MENÜ, DURAKLATMA, KONTROLLER
   ===================================================================== */
function fadeTo(fn) { $('fade').classList.add('on'); setTimeout(() => { fn(); setTimeout(() => $('fade').classList.remove('on'), 300); }, 800); }
let mSel = 0, mList = [];
function renderMenu() {
  const sv = loadSave(), can = sv && !sv.ended;
  mList = (can ? [['cont', `Devam Et<small>Gece ${sv.night}</small>`]] : []).concat([['new', 'Yeni Oyun'], ['set', 'Ayarlar'], ['keys', 'Kontroller'], ['quit', 'Çıkış']]);
  mSel = Math.min(mSel, mList.length - 1);
  $('mItems').innerHTML = mList.map(([k, t], i) => `<div class="mi2${i === mSel ? ' sel' : ''}" data-k="${k}" data-i="${i}">${t}</div>`).join('');
  $('mItems').querySelectorAll('.mi2').forEach(el => { el.onmouseenter = () => { if (mSel !== +el.dataset.i) { mSel = +el.dataset.i; SND.click(); renderMenu(); } }; el.onclick = () => menuGo(el.dataset.k); });
}
function menuPanel(html) { const p = $('mPanel'); p.innerHTML = html; p.classList.remove('hidden'); $('mItems').classList.add('hidden'); p.querySelector('[data-close]').onclick = closeMenuPanel; }
function closeMenuPanel() { $('mPanel').classList.add('hidden'); $('mItems').classList.remove('hidden'); SND.click(); }
function menuGo(k) {
  ac(); SND.click();
  if (k === 'cont') { S = loadSave(); if (S) fadeTo(startNight); }
  else if (k === 'new') {
    const sv = loadSave();
    if (sv && !sv.ended) { menuPanel(`<h3>YENİ OYUN</h3><p>Kayıtlı ilerlemen (Gece ${sv.night}) silinecek. Emin misin?</p><button id="mYes">Evet, baştan başla</button> <button data-close>Vazgeç</button>`); $('mYes').onclick = () => { $('mPanel').classList.add('hidden'); $('mItems').classList.remove('hidden'); S = freshSave(); fadeTo(startNight); }; }
    else { S = freshSave(); fadeTo(startNight); }
  }
  else if (k === 'set') {
    menuPanel(`<h3>AYARLAR</h3><label>Ses <input type="range" id="mVol" min="0" max="1" step=".05" value="${SET.vol}"></label><label>Fare hassasiyeti <input type="range" id="mSens" min=".3" max="2.5" step=".1" value="${SET.sens}"></label><button data-close>◀ Geri</button>`);
    $('mVol').oninput = e => { SET.vol = +e.target.value; $('vol').value = SET.vol; if (master) master.gain.value = SET.vol; localStorage.setItem('dk_set', JSON.stringify(SET)); };
    $('mSens').oninput = e => { SET.sens = +e.target.value; $('sens').value = SET.sens; localStorage.setItem('dk_set', JSON.stringify(SET)); };
  }
  else if (k === 'keys') menuPanel(`<h3>KONTROLLER</h3><div class="k"><b>W A S D</b><span>Yürü (Shift: hızlı)</span><b>Fare</b><span>Etrafa bak</span><b>E / Tık</b><span>Al, koy, konuş, kasayı aç</span><b>Q</b><span>Elindekini rafa geri koy</span><b>F</b><span>Fener</span><b>1 2 3</b><span>Cevap seç</span><b>Esc</b><span>Duraklat</span></div><button data-close>◀ Geri</button>`);
  else if (k === 'quit') location.href = 'index.html';
}
function showMenu() {
  state = 'menu'; unlockPointer(); ambStop();
  ['sum', 'pause', 'till', 'paper', 'dlg', 'hud'].forEach(id => $(id).classList.add('hidden')); dlg = null;
  if (N && N.cust) { scene.remove(N.cust.p.g); } if (depoGhost) { scene.remove(depoGhost.p.g); depoGhost = null; } if (ghost) { scene.remove(ghost.g); ghost = null; }
  N = null; $('menu').classList.remove('hidden'); $('mPanel').classList.add('hidden'); $('mItems').classList.remove('hidden'); mSel = 0; renderMenu();
  P.pos.set(-1.5, 0, 2.5); P.yaw = -2.4; P.pitch = -.08;
}
function pause() { if (state !== 'play') return; state = 'pause'; $('pause').classList.remove('hidden'); $('dlg').classList.add('hidden'); unlockPointer(); }
function resume() { $('pause').classList.add('hidden'); state = 'play'; if (dlg) $('dlg').classList.remove('hidden'); lockPointer(); }
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
  SND.click(); const p = b.dataset.p;
  if (p === 'go') resume(); else if (p === 'menu') { if (N && S) writeSave(); showMenu(); }
  else if (p === 'rules') { $('pause').classList.add('hidden'); state = 'play'; showPaper(RULES); }
});
$('vol').value = SET.vol; $('sens').value = SET.sens;
$('vol').oninput = e => { SET.vol = +e.target.value; if (master) master.gain.value = SET.vol; localStorage.setItem('dk_set', JSON.stringify(SET)); };
$('sens').oninput = e => { SET.sens = +e.target.value; localStorage.setItem('dk_set', JSON.stringify(SET)); };

function lockPointer() { if (state !== 'play' || dlg) return; try { const p = renderer.domElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
function unlockPointer() { if (document.pointerLockElement) document.exitPointerLock(); }
let lockGrace = 0;
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement) { if (state !== 'play' || dlg) unlockPointer(); return; }
  if (state === 'play' && $('paper').classList.contains('hidden') && performance.now() > lockGrace) pause();
});
renderer.domElement.addEventListener('click', () => { if (state === 'play' && !dlg && !document.pointerLockElement) lockPointer(); });
addEventListener('mousemove', e => {
  if (state !== 'play' || dlg || document.pointerLockElement !== renderer.domElement) return;
  const k = .0022 * SET.sens; P.yaw -= e.movementX * k; P.pitch = clamp(P.pitch - e.movementY * k, -1.35, 1.35);
});
addEventListener('mousedown', e => { if (state === 'play' && document.pointerLockElement && !dlg) interact(); });
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.repeat) return;
  if (state === 'menu') {
    if (!$('mPanel').classList.contains('hidden')) { if (e.code === 'Escape' || e.code === 'Backspace') closeMenuPanel(); return; }
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { mSel = (mSel + mList.length - 1) % mList.length; SND.click(); renderMenu(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { mSel = (mSel + 1) % mList.length; SND.click(); renderMenu(); }
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyE') menuGo(mList[mSel][0]);
    return;
  }
  if (state === 'till') { if (e.code === 'Escape') closeTill(); return; }
  if (dlg && e.code === 'Escape') { if (state === 'play') pause(); else if (state === 'pause') resume(); return; }
  if (dlg && state === 'pause') return;
  if (dlg) {
    if (dlg.choices && dlg.full && dlg.i === dlg.lines.length - 1) {
      const n = +e.key; if (n >= 1 && n <= dlg.choices.length) { chooseDlg(n - 1); return; }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { dlg.sel = (dlg.sel + dlg.choices.length - 1) % dlg.choices.length; renderDlg(); }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { dlg.sel = (dlg.sel + 1) % dlg.choices.length; renderDlg(); }
      if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyE') chooseDlg(dlg.sel);
      return;
    }
    if (['KeyE', 'Space', 'Enter'].includes(e.code)) advanceDlg();
    return;
  }
  if (!$('paper').classList.contains('hidden') && ['KeyE', 'Escape', 'Space'].includes(e.code)) { closePaper(); lockGrace = performance.now() + 400; lockPointer(); return; }
  if (state === 'pause' && e.code === 'Escape') { resume(); return; }
  if (state !== 'play') return;
  if (e.code === 'KeyE') interact();
  if (e.code === 'KeyQ' && held) returnHeld();
  if (e.code === 'KeyF') { flashOn = !flashOn; flash.intensity = flashOn ? 14 : 0; SND.click(); }
  if (e.code === 'Escape') pause();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* =====================================================================
   ANA DÖNGÜ
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  LH = 240; LW = Math.round(LH * w / h); rt.setSize(LW, LH); postMat.uniforms.res.value.set(LW, LH);
  SNAP.set(LW / 2.2, LH / 2.2); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let last = performance.now(), menuT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (state === 'menu') { menuT += dt; camera.position.set(-1.2 + Math.sin(menuT * .15) * .4, 1.55, 2.6); camera.rotation.set(-.06, -2.5 + Math.sin(menuT * .1) * .25, 0); }
  else { updatePlayer(dt); if (N && state !== 'pause' && state !== 'sum') { updateNight(dt, t); } }
  updateDlg(dt);
  // kapılar
  doorOpen += (doorTarget - doorOpen) * Math.min(1, dt * 5); doorPivot.rotation.y = -doorOpen * 1.3;
  depoOpen += (depoTarget - depoOpen) * Math.min(1, dt * 4); depoPivot.rotation.y = depoOpen * 1.6;
  // yağmur
  for (let i = 0; i < RAIN_N; i++) { rainPos[i * 3 + 1] -= dt * 9; if (rainPos[i * 3 + 1] < 0) rainPos[i * 3 + 1] = 6; } rainGeo.attributes.position.needsUpdate = true;
  // hud
  if (state === 'play' && N) {
    focus = dlg ? null : getFocus(); const pr = promptFor(focus);
    if (pr !== lastPrompt) { $('prompt').innerHTML = pr ? `<kbd>E</kbd>${pr}` : ''; lastPrompt = pr; }
    $('cross').classList.toggle('on', !!pr); updateHud();
  }
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').classList.add('hidden'); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (N && N.tvT > 0) { N.tvT -= dt; if (N.tvT <= 0 && N.tvMode === 'name') N.tvMode = 'demo'; }
  drawCRT(dt, t);
  glitch = Math.max(0, glitch - dt * 1.5);
  postMat.uniforms.time.value = t; postMat.uniforms.glitch.value = glitch; postMat.uniforms.red.value = 0;
  // kamera görüntüsü (TV ya da monitör)
  if (state === 'menu') return;   // menü resmi tam ekran, 3D çizmeye gerek yok
  renderMirror(dt);
  if ((N && N.tvMode === 'cam') || mon.visible) { renderer.setRenderTarget(camRT); renderer.render(scene, secCam); }
  renderer.setRenderTarget(rt); renderer.render(scene, camera);

}
showMenu();
requestAnimationFrame(frame);
window.__dk = { endNight: () => endNight(), restorePower: () => restorePower(), get S() { return S; }, get N() { return N; }, get P() { return P; }, get state() { return state; }, get focus() { return focus; }, interact, startNight, EV, openTill, get till() { return till; }, get counterItems() { return counterItems; }, setHeld, placeOnCounter, chooseDlg, advanceDlg, get dlg() { return dlg; }, freshSave, setS: s => { S = s; } };
