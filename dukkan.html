<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeynep'in Oyun Dükkânı</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e8e2d0;font-family:"Courier New",ui-monospace,monospace}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
  .hidden{display:none!important}
  .px{image-rendering:pixelated}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:2}
  #cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#e8e2d0;opacity:.8;box-shadow:0 0 0 1px #000}
  #cross.on{width:8px;height:8px;margin:-4px 0 0 -4px;background:none;border:2px solid #ffd870}
  #prompt{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:15px;font-weight:700;color:#fff;text-shadow:2px 2px 0 #000;white-space:nowrap}
  #prompt kbd{display:inline-block;border:2px solid #fff;padding:0 5px;margin-right:6px;font-family:inherit;background:rgba(0,0,0,.4)}
  #clock{position:absolute;right:18px;top:14px;text-align:right;text-shadow:2px 2px 0 #000}
  #clock b{display:block;font-size:30px;letter-spacing:2px;color:#ff5a3a;font-family:"Courier New",monospace}
  #clock span{font-size:13px;opacity:.85}
  #money{position:absolute;left:18px;top:14px;font-size:20px;font-weight:700;color:#9ee870;text-shadow:2px 2px 0 #000}
  #order{position:absolute;left:18px;top:48px;max-width:300px;background:#efe6c8;color:#2a2010;padding:10px 12px;font-size:14px;line-height:1.35;transform:rotate(-1.5deg);box-shadow:3px 3px 0 rgba(0,0,0,.6)}
  #order b{display:block;font-size:11px;letter-spacing:2px;opacity:.6;margin-bottom:3px}
  #tbc{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20vh;animation:fadein 2s}
  #tbc .tbcT{white-space:nowrap;font:900 clamp(40px,9vw,150px)/1 Impact,'Arial Black',sans-serif;letter-spacing:.04em;color:#8a0000;background:linear-gradient(#ff2020 0%,#9a0000 55%,#3a0000 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,0,0,.45)) drop-shadow(0 6px 0 #200);position:relative;animation:tbcShake 3s infinite;text-align:center}
  #tbc .drip{position:absolute;top:80%;width:1vw;border-radius:0 0 .6vw .6vw;background:linear-gradient(#9a0000,#5a0000);transform-origin:top;animation:drip ease-in forwards}
  #tbc .tbcT::after{display:none;content:'';position:absolute;left:4%;right:4%;top:88%;height:16vh;background:repeating-linear-gradient(90deg,transparent 0 3vw,#7a0000 3vw 3.6vw,transparent 3.6vw 7vw,#5a0000 7vw 7.4vw,transparent 7.4vw 10vw);-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent);animation:drip 4s ease-in forwards;transform-origin:top;opacity:.9}
  @keyframes drip{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes tbcShake{0%,92%,100%{transform:none}94%{transform:translate(3px,-2px) skewX(3deg)}96%{transform:translate(-3px,2px)}}
  #tbc .mbtn{opacity:0;animation:fadein 1s 2.5s forwards}
  #held{position:absolute;right:18px;bottom:78px;font-size:14px;text-shadow:2px 2px 0 #000;opacity:.9}
  #hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:14px;background:rgba(0,0,0,.55);padding:6px 12px;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
  #toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:18px;font-weight:700;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}
  #toast.on{opacity:1}
  /* diyalog */
  #dlg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(760px,94vw);display:flex;gap:14px;background:rgba(8,8,12,.88);border:2px solid #e8e2d0;padding:12px;z-index:5}
  #dlg canvas{width:132px;height:157px;border:2px solid #555;flex:none;background:#111;transform-origin:50% 60%}
  #dlg canvas.zin{animation:zin .45s cubic-bezier(.2,.8,.3,1)}
  @keyframes zin{from{transform:scale(.55);opacity:.2}to{transform:scale(1);opacity:1}}
  #selfCam{position:fixed;left:50%;bottom:150px;height:min(calc(100vh - 170px),78vw);aspect-ratio:1290/954;transform:translateX(-50%);z-index:4;border:3px solid #9f8cff;border-bottom:none;box-shadow:0 0 0 3px #000,0 0 50px rgba(0,0,0,.8);overflow:hidden;background:#100c18}
  #selfCam img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}
  #selfCam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);pointer-events:none}
  #selfCam.on img{animation:zcam .6s cubic-bezier(.2,.8,.3,1)}
  @keyframes zcam{from{transform:scale(1.25);filter:brightness(.4)}to{transform:scale(1);filter:none}}
  #selfCam.on{animation:fadein .35s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #dlg.me{border-color:#c8bcff}
  #dlg.me .nm{color:#c8bcff}
  #dlg .t{flex:1;display:flex;flex-direction:column;gap:6px}
  #dlg .nm{font-size:14px;font-weight:700;color:#ffd870;letter-spacing:1px}
  #dlg .tx{font-size:17px;line-height:1.4;min-height:48px}
  #dlg .ch{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  #dlg .ch button{font:inherit;font-size:15px;text-align:left;background:none;color:#e8e2d0;border:1px solid rgba(255,255,255,.25);padding:5px 9px;cursor:pointer}
  #dlg .ch button:hover,#dlg .ch button.sel{background:#e8e2d0;color:#111}
  #dlg .more{font-size:12px;opacity:.6;align-self:flex-end}
  /* kasa */
  #till{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);background:#1b1d1a;border:3px solid #6f7a5a;box-shadow:0 0 0 4px #000,0 20px 60px #000;padding:16px;z-index:6;color:#cfe8b0}
  #till h3{font-size:16px;letter-spacing:3px;margin-bottom:8px;color:#9ee870}
  #till .scr{background:#0b1408;border:2px solid #2d3a20;padding:10px;font-size:15px;line-height:1.5;margin-bottom:10px}
  #till .scr .row{display:flex;justify-content:space-between}
  #till .scr .big{font-size:20px;color:#d4ff9a}
  #till .bills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  #till .bills button,#till .act button{font:inherit;font-size:15px;font-weight:700;padding:9px 4px;background:#2c3326;color:#e9ffd0;border:2px solid #56664a;cursor:pointer}
  #till .bills button:hover,#till .act button:hover{background:#3d4a33}
  #till .act{display:flex;gap:8px}
  #till .act button{flex:1}
  #till .act .ok{background:#3c6a2a;border-color:#7ac35a}
  #till .msg{min-height:20px;font-size:14px;color:#ffb070;margin-top:6px}
  /* kâğıt */
  #pc{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
  #pc .win{width:min(860px,96vw);max-height:90vh;display:flex;flex-direction:column;background:#c0c0c0;color:#111;border:3px solid;border-color:#fff #444 #444 #fff;box-shadow:0 20px 60px #000;font-family:"Courier New",monospace}
  #pc .bar{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#1a2a8a,#3a6ac8);color:#fff;padding:5px 8px}
  #pc .bar b{flex:1;letter-spacing:2px}
  #pc .bar button{font:inherit;background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;cursor:pointer;padding:0 7px}
  #pc .tabs{display:flex;gap:4px;padding:6px 8px 0}
  #pc .tabs button{font:inherit;font-size:14px;padding:6px 12px;background:#b0b0b0;border:2px solid;border-color:#fff #444 #444 #fff;cursor:pointer}
  #pc .tabs button.on{background:#e0e0e0;font-weight:700}
  #pcBody{padding:10px;overflow:auto;background:#e0e0e0;margin:0 8px 8px;border:2px solid;border-color:#444 #fff #fff #444;min-height:340px}
  #pcBody h4{margin:6px 0;font-size:14px;letter-spacing:1px}
  #pcBody .row{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #999;font-size:14px}
  #pcBody .row .n{flex:1}
  #pcBody .row small{color:#555}
  #pcBody button{font:inherit;font-size:13px;padding:3px 10px;background:#c0c0c0;border:2px solid;border-color:#fff #444 #444 #fff;cursor:pointer}
  #pcBody button:disabled{color:#888;cursor:default}
  #pcBody .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  #pcBody .sw{display:inline-block;width:34px;height:22px;border:2px solid #444;vertical-align:middle;image-rendering:pixelated;background-size:cover}
  #pcBody .note{font-size:13px;color:#333;margin-top:8px}
  #camUI{position:fixed;inset:0;z-index:6;pointer-events:none;font-family:"Courier New",monospace;color:#fff;text-shadow:2px 2px 0 #000}
  #camUI .top{position:absolute;left:20px;right:20px;top:16px;display:flex;justify-content:space-between;font-size:20px}
  #camUI .rec{color:#ff3a3a;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  #camUI .bot{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:20px;font-size:15px}
  #camUI button{pointer-events:auto;font:inherit;font-size:16px;padding:6px 14px;background:rgba(0,0,0,.6);color:#fff;border:2px solid #fff;cursor:pointer}
  #paper{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);width:min(460px,92vw);background:#eadfbf;color:#2c2210;padding:26px 28px;z-index:6;box-shadow:6px 6px 0 rgba(0,0,0,.6);font-size:16px;line-height:1.55}
  #paper h3{font-size:18px;text-align:center;margin-bottom:12px;letter-spacing:2px}
  #paper ol{padding-left:22px}
  #paper li{margin-bottom:6px}
  #paper small{display:block;text-align:center;margin-top:14px;opacity:.6}
  #paper .sig{text-align:right;font-style:italic;margin-top:10px}
  /* menüler */
  .scrn{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.72);text-align:center;padding:20px}
  .scrn h1{font-size:clamp(28px,6vw,58px);letter-spacing:4px;color:#ffd870;text-shadow:4px 4px 0 #6a1a10,0 0 30px rgba(255,120,40,.35);line-height:1.05}
  .scrn h1 small{display:block;font-size:.35em;letter-spacing:8px;color:#e8e2d0;text-shadow:2px 2px 0 #000;margin-top:8px}
  .scrn h2{font-size:28px;letter-spacing:4px;color:#ffd870;text-shadow:3px 3px 0 #000}
  .scrn p{max-width:640px;font-size:16px;line-height:1.55}
  .mbtn{font:inherit;font-size:18px;font-weight:700;letter-spacing:2px;min-width:260px;padding:10px 20px;background:rgba(20,18,14,.9);color:#e8e2d0;border:2px solid #e8e2d0;cursor:pointer}
  .mbtn:hover,.mbtn.sel{background:#e8e2d0;color:#111}
  .mbtn:disabled{opacity:.35;cursor:default}
  #menu{position:fixed;inset:0;z-index:8;background:#0a0612;overflow:hidden}
  #menu .stage{position:absolute;left:50%;top:50%;width:max(100vw,177.68vh);aspect-ratio:1672/941;transform:translate(-50%,-50%);background:url(dk_menu.jpg) center/100% 100% no-repeat;container-type:size}
  #menu .stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
  #mItems{position:absolute;left:4.37%;top:47.1%;width:24.8%}
  .mi2{position:relative;display:flex;align-items:center;height:7.2cqh;padding-left:4.3cqw;font:700 3.25cqh/1 "Courier New",ui-monospace,monospace;letter-spacing:.08em;color:#e4dbe6;text-shadow:0 0 .4cqh rgba(0,0,0,.9);cursor:pointer;border:.3cqh solid transparent;margin-bottom:-.3cqh;user-select:none}
  .mi2.sel{border-color:#9f8cff;background:linear-gradient(90deg,rgba(70,40,160,.55),rgba(40,20,90,.35));box-shadow:0 0 1.4cqh rgba(130,110,255,.55),inset 0 0 1cqh rgba(130,110,255,.35)}
  .mi2.sel::before{content:"▶";position:absolute;left:1.3cqw;font-size:2.4cqh;color:#e4dbe6}
  .mi2 small{font-size:1.7cqh;opacity:.6;margin-left:1cqw;letter-spacing:0}
  #mPanel{position:absolute;left:4.37%;top:40%;width:30%;padding:2.4cqh 2cqw;background:rgba(14,8,28,.92);border:.3cqh solid #9f8cff;box-shadow:0 0 2cqh rgba(130,110,255,.4);font-size:2.1cqh;line-height:1.6;color:#e4dbe6}
  #mPanel h3{font-size:2.6cqh;letter-spacing:.2em;margin-bottom:1.4cqh;color:#c8bcff}
  #mPanel label{display:flex;justify-content:space-between;align-items:center;gap:1cqw;margin:1cqh 0}
  #mPanel input{width:55%}
  #mPanel .k{display:grid;grid-template-columns:auto 1fr;gap:.6cqh 1.6cqw}
  #mPanel .k b{color:#ffd870}
  #mPanel button{font:inherit;font-size:2cqh;margin-top:1.6cqh;padding:.8cqh 1.6cqw;background:rgba(70,40,160,.5);color:#fff;border:.25cqh solid #9f8cff;cursor:pointer}
  #sum{justify-content:flex-start;overflow-y:auto;padding-top:28px}
  #sum .tbl{font-size:16px;line-height:1.7;min-width:320px;text-align:left;background:rgba(0,0,0,.5);border:2px solid #555;padding:12px 18px}
  #sum .tbl div{display:flex;justify-content:space-between;gap:30px}
  #sum .tbl .neg{color:#ff7a5a}
  #sum .tbl .tot{border-top:2px solid #777;margin-top:6px;padding-top:6px;font-weight:700}
  #sum .cols{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  #sum .shop{background:rgba(0,0,0,.5);border:2px solid #555;padding:12px;max-width:520px;text-align:left}
  #sum .shop h4{font-size:14px;letter-spacing:2px;margin:4px 0 6px;color:#ffd870}
  #sum .shop .it{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
  #sum .shop .it small{opacity:.6;display:block;font-size:12px}
  #sum .shop button{font:inherit;font-size:13px;font-weight:700;padding:4px 10px;background:#2c3326;color:#e9ffd0;border:1px solid #6f7a5a;cursor:pointer;white-space:nowrap}
  #sum .shop button:disabled{opacity:.35;cursor:default}
  #sum .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  #fade{position:fixed;inset:0;background:#000;z-index:9;opacity:0;pointer-events:none;transition:opacity .8s}
  #fade.on{opacity:1}
  #title{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:7;font-size:clamp(26px,5vw,48px);letter-spacing:6px;color:#e8e2d0;text-shadow:3px 3px 0 #000;opacity:0;transition:opacity 1s;pointer-events:none}
  #title small{display:block;font-size:.4em;letter-spacing:4px;opacity:.75;margin-top:8px}
  #title.on{opacity:1}
  #scare{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;pointer-events:none}
  #scare canvas{height:110vh;image-rendering:pixelated;filter:contrast(1.6) saturate(.4);animation:shk .08s infinite}
  @keyframes shk{0%{transform:translate(-8px,4px) scale(1.05)}50%{transform:translate(7px,-5px) scale(1.08)}100%{transform:translate(-3px,6px) scale(1.04)}}
  #mob{position:fixed;inset:auto 0 0 0;padding:8px;font-size:12px;text-align:center;background:#311;z-index:11}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="money"></div>
  <div id="clock"><b>22:00</b><span></span></div>
  <div id="order" class="hidden"><b>SİPARİŞ</b><span></span></div>
  <div id="held"></div>
  <div id="hint" class="hidden"></div>
  <div id="toast"></div>
</div>

<div id="selfCam" class="hidden"><img src="dk_zeynep_konus.jpg" alt=""></div>
<div id="dlg" class="hidden">
  <canvas width="64" height="76" class="px"></canvas>
  <div class="t"><div class="nm"></div><div class="tx"></div><div class="ch"></div><div class="more">E / tıkla ▶</div></div>
</div>

<div id="till" class="hidden">
  <h3>▣ KASA</h3>
  <div class="scr"></div>
  <div class="bills"></div>
  <div class="act"><button id="tClr">Temizle</button><button id="tCancel">Vazgeç</button><button id="tOk" class="ok">Para üstünü ver ▶</button></div>
  <div class="msg"></div>
</div>

<div id="paper" class="hidden"></div>
<div id="pc" class="hidden">
  <div class="win">
    <div class="bar"><b>ZeynepOS 98</b><span id="pcMoney"></span><button id="pcX">✕</button></div>
    <div class="tabs"><button data-t="shop">🛒 Alışveriş</button><button data-t="skin">🎨 Özelleştirme</button><button data-t="cam">📹 Kameralar</button></div>
    <div id="pcBody"></div>
  </div>
</div>
<div id="camUI" class="hidden"><div class="top"><span class="rec">● REC</span><b id="camName"></b><span id="camClock"></span></div><div class="bot"><button id="camPrev">◀ A</button><span>Esc / E: çık</span><button id="camNext">D ▶</button></div></div>

<div id="menu">
  <div class="stage">
    <div id="mItems"></div>
    <div id="mPanel" class="hidden"></div>
  </div>
</div>

<div id="pause" class="scrn hidden">
  <h2>DURAKLATILDI</h2>
  <button class="mbtn" data-p="go">Devam</button>
  <button class="mbtn" data-p="rules">Dükkân Kuralları</button>
  <button class="mbtn" data-p="menu">Ana Menü</button>
  <label style="font-size:14px">Ses <input type="range" id="vol" min="0" max="1" step=".05" value=".8"></label>
  <label style="font-size:14px">Fare hassasiyeti <input type="range" id="sens" min=".3" max="2.5" step=".1" value="1"></label>
</div>

<div id="sum" class="scrn hidden"></div>
<div id="title"></div>
<div id="fade"></div>
<div id="scare" class="hidden"><canvas width="64" height="76"></canvas></div>
<div id="mob" class="hidden">Bu oyun klavye ve fare ile oynanır 🙏 Bilgisayardan gir.</div>

<script type="module">
import * as THREE from './three-uzay.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a), pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
if (matchMedia('(pointer: coarse)').matches) $('mob').classList.remove('hidden');

/* =====================================================================
   PSX GÖRÜNÜMÜ: düşük çözünürlük + köşe titremesi + renk kısma + dither
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
let LW = 400, LH = 240;
const rt = new THREE.WebGLRenderTarget(LW, LH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const SNAP = new THREE.Vector2(160, 100);
const postMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: rt.texture }, res: { value: new THREE.Vector2(LW, LH) }, time: { value: 0 }, glitch: { value: 0 }, dark: { value: 0 }, red: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tex; uniform vec2 res; uniform float time, glitch, dark, red; varying vec2 vUv;
    float bayer(vec2 p){ int x = int(mod(p.x, 4.)), y = int(mod(p.y, 4.));
      float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.); return m[x + y * 4] / 16.; }
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      if (glitch > 0.) { float l = floor(uv.y * res.y / 3.); float n = h(vec2(l, floor(time * 24.)));
        if (n < glitch * .6) uv.x += (n - .3) * glitch * .2; }
      vec3 c = texture2D(tex, uv).rgb;
      if (glitch > 0.) { c.r = texture2D(tex, uv + vec2(glitch * .01, 0.)).r; c.b = texture2D(tex, uv - vec2(glitch * .01, 0.)).b; }
      c = pow(max(c, 0.), vec3(1. / 2.2));
      vec2 p = floor(uv * res);
      c = floor(c * 26. + bayer(p)) / 26.;
      vec2 q = uv - .5; c *= 1. - dot(q, q) * 1.15;
      c += (h(p + fract(time) * 91.) - .5) * .035;
      c *= .93 + .07 * step(.5, fract(gl_FragCoord.y * .5));
      c = mix(c, vec3(c.r * 1.4 + .05, c.g * .25, c.b * .25), red);
      c *= 1. - dark;
      gl_FragColor = vec4(c, 1.);
