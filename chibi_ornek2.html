<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Karakterini Yarat — Ördekez</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:#3a2050;background:radial-gradient(circle at 20% 10%,#ffd6ec 0,transparent 40%),radial-gradient(circle at 85% 20%,#d6e4ff 0,transparent 45%),radial-gradient(circle at 50% 100%,#e6d6ff 0,transparent 55%),#f6efff;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,520px);gap:18px;padding:18px;max-width:1280px;margin:0 auto}
/* sahne */
#stageCard{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#7b5cff 0%,#ff6fb0 55%,#ffb36b 100%);box-shadow:0 18px 50px rgba(120,60,180,.35),inset 0 0 0 3px rgba(255,255,255,.35);display:flex;flex-direction:column;min-height:0}
#stageCard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,rgba(255,255,255,.55),transparent 38%),repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.07) 0 8deg,transparent 8deg 16deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px 0}
#top a{color:#fff;text-decoration:none;font-weight:900;background:rgba(255,255,255,.22);border-radius:12px;padding:6px 11px}
#title{font:400 26px 'Lilita One';color:#fff;text-shadow:0 3px 0 rgba(90,30,120,.45);margin:0;flex:1}
#nameIn{position:relative;z-index:2;margin:10px auto 0;display:block;width:min(260px,80%);text-align:center;font:900 18px Nunito;color:#5a2a7a;background:rgba(255,255,255,.88);border:0;border-radius:14px;padding:8px 12px;outline:none;box-shadow:0 4px 0 rgba(90,30,120,.25)}
#cv{position:relative;z-index:1;flex:1;width:100%;min-height:0;cursor:grab;touch-action:none}
#ctrl{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 14px 16px}
.chip{border:0;border-radius:999px;padding:8px 13px;font:900 14px Nunito;color:#5a2a7a;background:rgba(255,255,255,.85);cursor:pointer;box-shadow:0 3px 0 rgba(90,30,120,.25);transition:transform .1s}
.chip:active{transform:translateY(2px);box-shadow:none}.chip.on{background:#ffe57a;color:#6a3a00}
.big{font-size:16px;padding:11px 20px}.go{background:linear-gradient(#7dffb0,#2fd17a);color:#05391c}.rnd{background:linear-gradient(#fff3a8,#ffcc3a);color:#5a3a00}
/* panel */
#panel{background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border-radius:28px;box-shadow:0 18px 50px rgba(120,60,180,.2),inset 0 0 0 2px #fff;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#tabs{display:flex;gap:6px;padding:12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex-shrink:0;border:0;border-radius:16px;padding:8px 10px;min-width:64px;font:900 12px Nunito;color:#7a5a9a;background:#f2e8ff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button i{font-style:normal;font-size:22px}
#tabs button.on{background:linear-gradient(135deg,#a07aff,#ff7ab8);color:#fff;box-shadow:0 4px 12px rgba(160,90,255,.4)}
#opts{flex:1;overflow:auto;padding:4px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start}
.op{border:0;border-radius:18px;background:#fff;padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 12px Nunito;color:#6a4a8a;box-shadow:0 3px 0 #e6d8f8;transition:transform .12s}
.op:hover{transform:translateY(-2px)}.op canvas{width:84px;height:84px}
.op.on{background:linear-gradient(#fff6c8,#ffe57a);color:#6a3a00;box-shadow:0 0 0 3px #ffb800,0 3px 0 #e6a800}
#colors{flex-shrink:0;border-top:2px dashed #e6d8f8;padding:10px 12px 14px;max-height:34%;overflow:auto}
.cr{margin-bottom:8px}.cr b{display:block;font-size:13px;margin:0 0 5px 2px;color:#7a5a9a}
.sws{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(80,40,120,.25);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px #a07aff,0 2px 6px rgba(80,40,120,.35);transform:scale(1.12)}
.pick{position:relative;width:30px;height:30px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border:3px solid #fff;box-shadow:0 2px 6px rgba(80,40,120,.25);overflow:hidden}
.pick input{position:absolute;inset:-6px;opacity:0;cursor:pointer}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:#2fd17a;color:#fff;font-weight:900;padding:10px 18px;border-radius:14px;transition:transform .35s cubic-bezier(.3,1.5,.5,1);z-index:9}
#toast.on{transform:translate(-50%,0)}
@media (max-width:820px){
  body{overflow:auto}#app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;padding:10px;gap:10px}
  #stageCard{height:58vh;min-height:340px}#panel{height:auto;max-height:none}#opts{max-height:46vh;grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}.op canvas{width:70px;height:70px}#colors{max-height:none}
  #title{font-size:21px}
}
@media (max-height:520px) and (orientation:landscape){#app{grid-template-columns:1fr 1.1fr;padding:8px;gap:8px}#title{font-size:18px}#nameIn{font-size:14px;padding:4px 8px;margin-top:4px}.chip{padding:5px 9px;font-size:12px}#ctrl{padding-bottom:8px;gap:5px}#tabs{padding:8px}#tabs button{min-width:52px;padding:5px 7px}#tabs button i{font-size:17px}.op canvas{width:60px;height:60px}#opts{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}#colors{max-height:38%}.sw,.pick{width:24px;height:24px}}
</style></head><body>
<div id="app">
  <div id="stageCard">
    <div id="top"><a href="index.html">←</a><h1 id="title">Karakterini Yarat ✨</h1></div>
    <input id="nameIn" maxlength="16" placeholder="Karakterinin adı">
    <canvas id="cv"></canvas>
    <div id="ctrl">
      <button class="chip" data-r="-1">◀</button><button class="chip" data-r="1">▶</button>
      <button class="chip on" data-a="idle">🧍</button><button class="chip" data-a="walk">🚶</button><button class="chip" data-a="wave">👋</button><button class="chip" data-a="cheer">🙌</button><button class="chip" data-a="fish">🎣</button><button class="chip" data-a="sit">🪑</button>
      <button class="chip big rnd" id="rnd">🎲 Rastgele</button><button class="chip big go" id="save">✅ Kaydet</button>
    </div>
  </div>
  <div id="panel"><div id="tabs"></div><div id="opts"></div><div id="colors"></div></div>
</div>
<div id="toast">Karakterin kaydedildi! 🎉</div>
<script src="bk/chibi2.js"></script>
<script>
const K = Chibi2, C = K.COLORS, $ = id => document.getElementById(id);
const DEF = { ten: '#ffe0cc', sac: 'anime', sacR: '#241622', goz: '#2a8aff', gozT: 'parlak', agiz: 'gulus', ust: '#ff6fae', ustT: 'kapusonlu', alt: '#1e2e5a', ayak: '#f4f4f4', sapka: 'yok', sapkaR: '#ff4a5a', aks: 'yok', aksR: '#ff4a5a', aura: 'yok' };
let me = Object.assign({}, DEF); try { Object.assign(me, JSON.parse(localStorage.getItem('bk_chibi') || '{}')); } catch (e) {}
$('nameIn').value = me.ad || (localStorage.getItem('ordekez_user') || '');
const DIRS = ['s', 'e', 'n', 'w']; let di = 0, anim = 'idle', spinT = 0;
const TABS = [
  { k: 'sac', ic: '💇', ad: 'Saç', o: K.HAIR, col: [['sacR', 'Saç rengi', C.sac]], head: 1 },
  { k: 'gozT', ic: '👀', ad: 'Göz', o: K.EYE, col: [['goz', 'Göz rengi', C.goz]], head: 1, zoom: 1 },
  { k: 'agiz', ic: '👄', ad: 'Ağız', o: K.MOUTH, col: [['ten', 'Ten rengi', C.ten]], head: 1, zoom: 1 },
  { k: 'ustT', ic: '👕', ad: 'Üst', o: K.TOP, col: [['ust', 'Üst rengi', C.giysi]] },
  { k: null, ic: '👖', ad: 'Alt', col: [['alt', 'Pantolon / etek', C.giysi], ['ayak', 'Ayakkabı', C.giysi]] },
  { k: 'sapka', ic: '🎩', ad: 'Şapka', o: K.HAT, col: [['sapkaR', 'Şapka rengi', C.giysi.concat(C.sac)]], head: 1 },
  { k: 'aks', ic: '🕶️', ad: 'Aksesuar', o: K.ACC, col: [['aksR', 'Atkı rengi', C.giysi]], head: 1 },
  { k: 'aura', ic: '✨', ad: 'Aura', o: K.AURA, col: [] },
  { k: null, ic: '🎨', ad: 'Ten', col: [['ten', 'Ten rengi', C.ten]] },
];
let tab = TABS[0];
// sahne
const cv = $('cv'), g = cv.getContext('2d');
function fit() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; }
addEventListener('resize', fit);
const bub = Array.from({ length: 18 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: 3 + Math.random() * 7, s: .02 + Math.random() * .05 }));
function frame() {
  const W = cv.width, H = cv.height, t = performance.now() / 1000; g.clearRect(0, 0, W, H);
  for (const b of bub) { b.y -= b.s * .016; if (b.y < -.05) { b.y = 1.05; b.x = Math.random(); } g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(b.x * W, b.y * H, b.r * W / 600, 0, 7); g.fill(); }
  const sc = Math.min(W / 150, H / 190) * .92, cx = W / 2, cy = H * .5 + 10 * sc;
  // podyum
  g.fillStyle = 'rgba(80,20,120,.25)'; g.beginPath(); g.ellipse(cx, cy + 62 * sc, 58 * sc, 15 * sc, 0, 0, 7); g.fill();
  const pg = g.createLinearGradient(0, cy + 48 * sc, 0, cy + 62 * sc); pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#ffd6f0');
  g.fillStyle = pg; g.beginPath(); g.ellipse(cx, cy + 55 * sc, 54 * sc, 13 * sc, 0, 0, 7); g.fill(); g.strokeStyle = 'rgba(160,90,255,.5)'; g.lineWidth = 2 * sc / 3; g.stroke();
  K.draw(g, me, cx, cy, sc, { dir: DIRS[di], anim, t });
  if (anim === 'fish') { const s = DIRS[di] === 'w' ? -1 : 1, hx = cx + s * 25 * sc, hy = cy + 20 * sc; g.lineCap = 'round'; g.strokeStyle = '#3a2210'; g.lineWidth = 3.2 * sc / 2.5 * 2; g.beginPath(); g.moveTo(hx - s * 4 * sc, hy + 4 * sc); g.quadraticCurveTo(hx + s * 24 * sc, hy - 34 * sc, hx + s * 56 * sc, hy - 62 * sc); g.stroke(); g.strokeStyle = '#d8a050'; g.lineWidth *= .55; g.stroke(); }
  requestAnimationFrame(frame);
}
// sürükleyerek döndür
let dragX = null; cv.addEventListener('pointerdown', e => dragX = e.clientX); addEventListener('pointerup', () => dragX = null);
addEventListener('pointermove', e => { if (dragX == null) return; if (Math.abs(e.clientX - dragX) > 40) { di = (di + (e.clientX > dragX ? 3 : 1)) % 4; dragX = e.clientX; } });
document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => di = (di + 4 + +b.dataset.r) % 4);
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { anim = b.dataset.a; document.querySelectorAll('[data-a]').forEach(x => x.classList.toggle('on', x === b)); });
// sekmeler
function tabs() { $('tabs').innerHTML = ''; TABS.forEach(T => { const b = document.createElement('button'); b.innerHTML = `<i>${T.ic}</i>${T.ad}`; b.classList.toggle('on', T === tab); b.onclick = () => { tab = T; tabs(); opts(); colors(); }; $('tabs').appendChild(b); }); }
function thumb(c, cfg, T) { const x = c.getContext('2d'), w = c.width; x.clearRect(0, 0, w, w);
  const bg = x.createRadialGradient(w / 2, w / 2, 4, w / 2, w / 2, w / 2); bg.addColorStop(0, '#fff6fc'); bg.addColorStop(1, '#f1e4ff'); x.fillStyle = bg; x.beginPath(); x.arc(w / 2, w / 2, w / 2 - 2, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(w / 2, w / 2, w / 2 - 2, 0, 7); x.clip();
  if (T.zoom) { const k = w / 58; K.draw(x, cfg, w / 2, w * .5 + 8 * k, k, { t: 1.2 }); } else if (T.head) { const k = w / 108; K.draw(x, cfg, w / 2, w * .58 + 26 * k, k, { t: 1.2 }); } else K.draw(x, cfg, w / 2, w * .62, w / 150, { t: 1.2 });
  x.restore(); }
function opts() {
  const box = $('opts'); box.innerHTML = '';
  if (!tab.o) { box.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px 10px;color:#9a7aba;font-weight:800">Aşağıdan renkleri seç 👇</div>`; return; }
  for (const [v, ad0] of Object.entries(tab.o)) { const ad = ad0.ad || ad0, b = document.createElement('button'); b.className = 'op' + (me[tab.k] === v ? ' on' : '');
    const c = document.createElement('canvas'); c.width = c.height = 168; b.appendChild(c); b.insertAdjacentHTML('beforeend', `<span>${ad}</span>`);
    thumb(c, Object.assign({}, me, { [tab.k]: v }), tab);
    b.onclick = () => { me[tab.k] = v; opts(); }; box.appendChild(b); }
}
function colors() {
  const box = $('colors'); box.innerHTML = ''; box.style.display = tab.col.length ? '' : 'none';
  for (const [key, lbl, list] of tab.col) { const r = document.createElement('div'); r.className = 'cr'; r.innerHTML = `<b>${lbl}</b>`; const s = document.createElement('div'); s.className = 'sws';
    for (const c of list) { const b = document.createElement('button'); b.className = 'sw' + (me[key] === c ? ' on' : ''); b.style.background = `radial-gradient(circle at 35% 30%,${c}cc,${c})`; b.onclick = () => { me[key] = c; colors(); opts(); }; s.appendChild(b); }
    const p = document.createElement('label'); p.className = 'pick'; p.title = 'İstediğin renk'; const i = document.createElement('input'); i.type = 'color'; i.value = me[key]; i.oninput = () => { me[key] = i.value; }; i.onchange = () => { colors(); opts(); }; p.appendChild(i); s.appendChild(p);
    r.appendChild(s); box.appendChild(r); }
}
const pick = a => a[Math.floor(Math.random() * a.length)];
$('rnd').onclick = () => { const ks = o => Object.keys(o);
  Object.assign(me, { ten: pick(C.ten.slice(0, 7)), sac: pick(ks(K.HAIR)), sacR: pick(C.sac), goz: pick(C.goz), gozT: pick(ks(K.EYE)), agiz: pick(ks(K.MOUTH)), ust: pick(C.giysi), ustT: pick(ks(K.TOP)), alt: pick(C.giysi), ayak: pick(C.giysi),
    sapka: Math.random() < .55 ? pick(ks(K.HAT)) : 'yok', sapkaR: pick(C.giysi), aks: Math.random() < .5 ? pick(ks(K.ACC)) : 'yok', aksR: pick(C.giysi), aura: Math.random() < .25 ? pick(ks(K.AURA)) : 'yok' });
  anim = 'cheer'; setTimeout(() => anim === 'cheer' && (anim = 'idle'), 1200); opts(); colors(); };
$('save').onclick = () => { me.ad = $('nameIn').value.trim(); try { localStorage.setItem('bk_chibi', JSON.stringify(me)); } catch (e) {} $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1800); anim = 'cheer'; setTimeout(() => anim = 'idle', 1500); };
fit(); tabs(); opts(); colors(); frame();
</script></body></html>
