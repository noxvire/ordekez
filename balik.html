<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ördekez Balıkçılık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2a3a;font-family:'Nunito',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.px{font-family:'Pixelify Sans','Nunito',system-ui}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:rgba(20,30,48,.78);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 12px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill small{opacity:.7;font-weight:700}
#hudR{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hb{pointer-events:auto;border:0;border-radius:12px;background:#f7c948;color:#4a2a00;font-weight:900;font-size:14px;padding:8px 11px;box-shadow:0 3px 0 #b07800}
.hb.b{background:#7fd0ff;color:#06314a;box-shadow:0 3px 0 #3a8fc0}
#xpbar{width:120px;height:7px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-top:3px}#xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7fff9a,#2fd36a)}
#online{font-size:12px}
/* chat */
#chatLog{position:fixed;left:12px;bottom:84px;width:min(380px,60vw);z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:3px}
#chatLog div{background:rgba(10,18,30,.55);padding:3px 9px;border-radius:9px;font-size:13px;font-weight:700;text-shadow:0 1px 0 #000;animation:fadeL 12s forwards}
#chatLog b{color:#ffd84a}#chatLog .sys{color:#9fe8ff}#chatLog .ann{background:rgba(120,60,0,.75);color:#ffe18a}
@keyframes fadeL{0%,85%{opacity:1}100%{opacity:0}}
#chatBox{position:fixed;left:12px;bottom:40px;z-index:6;display:flex;gap:6px;width:min(420px,calc(100vw - 24px))}
#chatIn{flex:1;font:700 15px 'Nunito';padding:9px 12px;border-radius:12px;border:2px solid #7fd0ff;background:rgba(10,20,34,.9);color:#fff;outline:none}
/* prompt */
#prompt{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:4;background:rgba(10,18,30,.8);border:2px solid #ffd84a;padding:7px 14px;border-radius:12px;font-weight:900;font-size:15px;pointer-events:auto;cursor:pointer}
#prompt kbd{background:#ffd84a;color:#3a2400;border-radius:5px;padding:0 6px;margin-right:6px}
/* toast */
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#toast div{background:rgba(10,18,30,.9);border:2px solid #7fd0ff;border-radius:12px;padding:7px 14px;font-weight:900;animation:tIn .3s,tOut .4s 2.6s forwards}
@keyframes tIn{from{transform:translateY(-14px);opacity:0}}@keyframes tOut{to{opacity:0;transform:translateY(-10px)}}
/* mobil */
#joy{position:fixed;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);z-index:5;display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.4)}
#actBtn{position:fixed;right:22px;bottom:26px;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 40% 35%,#ffe57a,#f0a400);font-size:38px;z-index:5;display:none;box-shadow:0 5px 0 #a06a00;touch-action:none}
#actBtn.reel{background:radial-gradient(circle at 40% 35%,#8fffb4,#18b85a);box-shadow:0 5px 0 #0c7a3a}
.mb{position:fixed;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,48,.75);font-size:22px;z-index:5;display:none}
#chatBtn{right:128px;bottom:30px}#emoBtn{right:128px;bottom:92px}
body.touch #joy,body.touch #actBtn,body.touch .mb{display:block}
body.touch #chatLog{bottom:150px}
#emoMenu{position:fixed;right:190px;bottom:80px;z-index:7;display:flex;flex-direction:column;gap:6px}
#emoMenu button{border:0;border-radius:12px;padding:9px 14px;font-weight:900;font-size:15px;background:rgba(20,30,48,.92);color:#fff;border:2px solid #7fd0ff}
body:not(.touch) #emoMenu{right:auto;left:50%;bottom:auto;top:70px;transform:translateX(-50%);flex-direction:row}
/* paneller */
.scr{position:fixed;inset:0;z-index:20;background:rgba(6,12,22,.72);display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:linear-gradient(#fff8e8,#f3e2bf);color:#4a3218;border:4px solid #8a5a2b;border-radius:18px;box-shadow:0 10px 0 #5a3a18,0 20px 40px rgba(0,0,0,.5);width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.card h2{margin:0;padding:12px 16px;font-family:'Pixelify Sans';font-size:26px;background:#8a5a2b;color:#ffe9b8;display:flex;align-items:center;gap:10px}
.card h2 .x{margin-left:auto;border:0;background:#ffe9b8;color:#5a3a18;width:36px;height:36px;border-radius:10px;font-size:20px;font-weight:900}
.body{padding:14px;overflow:auto;flex:1}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:15px;background:#f7c948;color:#4a2a00;box-shadow:0 3px 0 #b07800}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.btn.g{background:#5fd38a;color:#06341a;box-shadow:0 3px 0 #2a8f52}.btn.r{background:#ff8a8a;color:#4a0a0a;box-shadow:0 3px 0 #c04848}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.it{background:#fffaf0;border:3px solid #e2c99a;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative}
.it canvas{image-rendering:pixelated}
.it b{font-size:14px}.it small{font-size:12px;opacity:.8}
.rar0{border-color:#b8b8b8}.rar1{border-color:#5aa9ff}.rar2{border-color:#b56cff}.rar3{border-color:#ffb81c}.rar4{border-color:#ff4b6e;box-shadow:0 0 12px #ff4b6e66}
.rt0{color:#7a7a7a}.rt1{color:#2f7fd8}.rt2{color:#9a4ae0}.rt3{color:#d08a00}.rt4{color:#e0204a}
.tag{font-size:11px;font-weight:900;border-radius:8px;padding:1px 7px;color:#fff}
.mut{background:linear-gradient(90deg,#ff6fae,#7f6bff,#2fd3ff);}
.it .lock{position:absolute;top:4px;right:6px;font-size:16px;cursor:pointer;opacity:.4}.it .lock.on{opacity:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{display:inline-flex;gap:3px;font-size:12px;background:#f3e2bf;border-radius:8px;padding:2px 7px;font-weight:800}
/* yakalama */
#catch{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,240,180,.25),rgba(6,12,22,.7))}
#catch .cc{background:linear-gradient(#fff8e8,#f3e2bf);color:#4a3218;border:4px solid #8a5a2b;border-radius:20px;padding:18px 22px;text-align:center;min-width:280px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#catch canvas{image-rendering:pixelated;display:block;margin:4px auto}
#catch h3{margin:0;font-family:'Pixelify Sans';font-size:28px}
.new{display:inline-block;background:#ff4b6e;color:#fff;font-weight:900;border-radius:8px;padding:1px 8px;font-size:12px;animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}
/* editör */
#ed .card{width:min(1100px,100%);height:min(720px,100%)}
#edWrap{display:flex;gap:12px;flex:1;min-height:0;padding:12px}
#edL{width:250px;display:flex;flex-direction:column;align-items:center;gap:8px}
#edPrev{background:radial-gradient(#cfe9ff,#8fbfe8);border-radius:16px;border:3px solid #8a5a2b;image-rendering:pixelated;width:240px;height:240px}
#edR{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#edTabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
#edTabs button{border:2px solid #e2c99a;background:#fffaf0;border-radius:10px;padding:5px 8px;font-weight:900;font-size:13px;color:#5a3a18}
#edTabs button.on{background:#f7c948;border-color:#b07800}
#edItems{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px;align-content:start;padding:2px}
#edItems .o{background:#fffaf0;border:3px solid #e2c99a;border-radius:12px;padding:3px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;line-height:1.1;text-align:center;cursor:pointer;min-height:96px}
#edItems .o.on{border-color:#f0a400;background:#fff2c4;box-shadow:0 0 0 2px #f7c948}
#edItems .o canvas{width:72px;height:72px;image-rendering:pixelated}
#edCols{max-height:150px;overflow:auto;margin-top:8px;border-top:2px dashed #e2c99a;padding-top:6px}
.cl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.cl>span{font-weight:900;font-size:13px;min-width:70px}
.sw{width:24px;height:24px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px #8a5a2b;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px #e0204a}
.cl input[type=color]{width:34px;height:28px;border:0;padding:0;background:none}
#edBody{display:flex;gap:6px}
@media (max-width:760px),(max-height:520px){#edWrap{flex-direction:column;padding:8px;gap:6px}#edL{width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center}#edPrev{width:150px;height:150px}#ed .card h2{font-size:20px;padding:8px 12px}#edCols{max-height:110px}}
@media (max-height:520px){#ed{padding:4px}#ed .card{height:100%}#ed .card h2{padding:5px 10px;font-size:17px}#ed .card h2 .x{width:30px;height:30px}
#edWrap{flex-direction:row;padding:6px;gap:8px}#edL{width:150px;flex-direction:column;flex-wrap:nowrap;gap:5px}#edPrev{width:130px;height:130px}#edL .btn{padding:6px 9px;font-size:12px}
#edTabs{flex-wrap:nowrap;overflow-x:auto;margin-bottom:5px;padding-bottom:3px}#edTabs button{white-space:nowrap;font-size:12px;padding:4px 7px}
#edItems{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}#edItems .o{min-height:78px}#edItems .o canvas{width:56px;height:56px}
#edCols{max-height:58px;margin-top:4px;padding-top:4px}.sw{width:20px;height:20px}}
/* yükleniyor */
#load{position:fixed;inset:0;z-index:50;background:#1b2a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:'Pixelify Sans';font-size:26px}
#load small{font-family:Nunito;font-size:14px;opacity:.7}
#back{pointer-events:auto;text-decoration:none}
</style>
</head>

function openBag() { const el = $('bagList'); el.innerHTML = ''; $('bagInfo').textContent = `${S.bag.length}/${BAGCAP()} balık · değer 🪙 ${fmt(S.bag.reduce((a, f) => a + f.v, 0))}`; S.bag.slice().reverse().forEach(f => el.appendChild(fishCard(f, f.fav ? '<small>⭐ kilitli</small>' : ''))); if (!S.bag.length) el.innerHTML = '<p>Çantan boş.</p>'; $('bagScr').classList.remove('hidden'); }

/* =================== KARAKTER EDİTÖRÜ =================== */
let edOpen = false, edCfg = null, edCat = 'sac', edDir = 2, edAnimI = 0, edSheet = null, edFirst = false;
const ED_ANIMS = ['walk', 'idle', 'fish', 'sit', 'emote'], ED_AIC = ['🚶', '🧍', '🎣', '🪑', '👋'];
const HEADCATS = { bas: 1, ifade: 1, kas: 1, burun: 1, kulak: 1, kirisik: 1, sac: 1, sacek: 1, sakal: 1, biyik: 1, sapka: 1, gozluk: 1, kupe: 1, boynuz: 1 };
function openEd(first) {
  edFirst = first === true; edOpen = true; edCfg = JSON.parse(JSON.stringify(S.cfg || CharLib.defaults('male')));
  $('edX').classList.toggle('hidden', edFirst); $('ed').classList.remove('hidden');
  const tabs = $('edTabs'); tabs.innerHTML = '';
  CharLib.CATS.forEach(([k, ad, ic]) => { if (!CharLib.byCat(k).length) return; const b = document.createElement('button'); b.textContent = ic + ' ' + ad; b.dataset.k = k; b.onclick = () => { edCat = k; edRender(); }; tabs.appendChild(b); });
  edRender();
}
function edClose() { edOpen = false; $('ed').classList.add('hidden'); }
let edGen = 0;
async function edRender() {
  const gen = ++edGen;
  document.querySelectorAll('#edTabs button').forEach(b => b.classList.toggle('on', b.dataset.k === edCat));
  document.querySelectorAll('#edBody button').forEach(b => b.classList.toggle('g', b.dataset.b === edCfg.b));
  edSheet = await CharLib.compose(edCfg);
  const box = $('edItems'); box.innerHTML = '';
  const opts = CharLib.byCat(edCat).filter(i => CharLib.usable(edCfg, i) && (i.b.includes(edCfg.b)));
  const list = (CharLib.REQUIRED[edCat] ? [] : [null]).concat(opts);
  const els = list.map(it => { const d = document.createElement('div'); d.className = 'o' + ((edCfg.it[edCat] || null) === (it ? it.id : null) ? ' on' : '');
    const c = document.createElement('canvas'); c.width = 72; c.height = 72; d.appendChild(c); d.insertAdjacentHTML('beforeend', `<span>${it ? it.tr : 'Yok'}</span>`);
    d.onclick = () => { if (it) edCfg.it[edCat] = it.id; else delete edCfg.it[edCat]; if (edCat === 'bas') { for (const k in edCfg.it) { const x = CharLib.BYID[edCfg.it[k]]; if (x && !CharLib.usable(edCfg, x)) delete edCfg.it[k]; } if (!edCfg.it.ifade && (CharLib.BYID[edCfg.it.bas].tags || []).includes('human')) edCfg.it.ifade = 'expression_neutral'; } edRender(); };
    box.appendChild(d); return [c, it]; });
  edColors();

    const cfg = JSON.parse(JSON.stringify(edCfg)); if (it) cfg.it[edCat] = it.id; else delete cfg.it[edCat];
    const sh = await CharLib.compose(cfg); if (gen !== edGen) return;

    if (HEADCATS[edCat]) g.drawImage(sh, 14, (CharLib.ANIM.idle.r + 2) * 64 + 4, 36, 36, 0, 0, 72, 72);
    else g.drawImage(sh, 0, (CharLib.ANIM.idle.r + 2) * 64, 64, 64, 0, 0, 72, 72);
  }
}
function edColors() {
  const box = $('edCols'); box.innerHTML = '';

  const it = CharLib.BYID[edCfg.it[edCat]];
  if (it && it.s) it.s.forEach((s, si) => { const k = CharLib.colorKey(it, si); add(k, k === 'ten' ? '🎨 Ten' : k === 'goz' ? '👁️ Göz' : k === 'sac' ? '🎨 Saç rengi' : '🎨 ' + (s.lab ? (s.lab === 'Eye Color' ? 'Göz' : s.lab) : 'Renk') + (it.s.length > 1 && !s.lab ? ' ' + (si + 1) : ''), s.m); });
  if (edCat === 'ifade' || edCat === 'bas') add('goz', '👁️ Göz', 'eye');
  for (const [key, label, mat] of rows) {
    const r = document.createElement('div'); r.className = 'cl'; r.innerHTML = `<span>${label}</span>`;

      b.style.background = `linear-gradient(135deg,${p[Math.min(4, p.length - 1)]},${p[Math.max(0, p.length - 3)]})`; b.title = ref.split('.')[2]; b.onclick = () => { edCfg.c[key] = ref; edRender(); }; r.appendChild(b); });
    const ci = document.createElement('input'); ci.type = 'color'; ci.value = cur && cur[0] === '#' ? cur : '#ff6fae'; ci.title = 'Kendi rengin';

$('edRot').onclick = () => edDir = (edDir + 1) % 4;
$('edAnim').onclick = () => { edAnimI = (edAnimI + 1) % ED_ANIMS.length; $('edAnim').textContent = ED_AIC[edAnimI]; };

(function edLoop() { if (edOpen && edSheet) { const c = $('edPrev'), g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 240, 240);
