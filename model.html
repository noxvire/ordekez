<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>3D Model Önizleme — Ördekez</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#0c1024;color:#fff}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:0;right:0;top:0;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:linear-gradient(rgba(10,14,40,.85),transparent)}
.b{border:1px solid #e8c06a;background:rgba(10,14,40,.6);color:#f4dfa8;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:14px}
.b.on{background:#e8c06a;color:#1a1530}
#anims{display:flex;flex-wrap:wrap;gap:6px}
#drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:22px;font-weight:900;color:#f4dfa8;text-align:center;line-height:1.6}
#info{position:fixed;left:12px;bottom:10px;font-size:13px;opacity:.8}</style></head><body>
<div id="ui"><a class="b" href="index.html" style="text-decoration:none">←</a><label class="b">📂 .glb dosyası seç<input id="f" type="file" accept=".glb,.gltf" hidden></label><div id="anims"></div></div>
<div id="drop">.glb dosyasını buraya sürükle<br><small style="font-size:15px;opacity:.7">ya da yukarıdan seç · fareyle sürükleyip döndür, tekerlekle yakınlaş</small></div>
<div id="info"></div>
<script type="module">
import * as THREE from './three-uzay.js';
import { GLTFLoader } from './gltf.js';
const $ = id => document.getElementById(id);
const R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.setSize(innerWidth, innerHeight); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#e8eaf2');
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .01, 200);
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
S.add(new THREE.HemisphereLight('#ffffff', '#b0a490', 1.2)); const d = new THREE.DirectionalLight('#fff4e0', 2); d.position.set(3, 6, 4); S.add(d);
const fl = new THREE.Mesh(new THREE.CircleGeometry(2, 48), new THREE.MeshStandardMaterial({ color: '#f4f0ea', roughness: .3 })); fl.rotation.x = -Math.PI / 2; S.add(fl);
const ring = new THREE.Mesh(new THREE.TorusGeometry(2, .03, 8, 64), new THREE.MeshStandardMaterial({ color: '#e0b864', metalness: .9, roughness: .3 })); ring.rotation.x = Math.PI / 2; S.add(ring);
let model = null, mixer = null, act = null, yaw = .5, pitch = .15, dist = 3.2, H = 1.8;
const loader = new GLTFLoader();
function load(url, name) {
  loader.load(url, g => {
    if (model) S.remove(model); model = g.scene; S.add(model);
    const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), k = 1.8 / Math.max(size.y, .001);
    model.scale.setScalar(k); const b2 = new THREE.Box3().setFromObject(model); model.position.y -= b2.min.y; model.position.x -= (b2.min.x + b2.max.x) / 2; model.position.z -= (b2.min.z + b2.max.z) / 2;
    H = 1.8; dist = 3.2; $('drop').style.display = 'none';
    mixer = new THREE.AnimationMixer(model); $('anims').innerHTML = '';
    g.animations.forEach((c, i) => { const b = document.createElement('button'); b.className = 'b'; b.textContent = '▶ ' + (c.name || 'Animasyon ' + (i + 1)); b.onclick = () => { if (act) act.fadeOut(.2); act = mixer.clipAction(c).reset().fadeIn(.2).play(); document.querySelectorAll('#anims .b').forEach(x => x.classList.toggle('on', x === b)); }; $('anims').appendChild(b); if (i === 0) b.click(); });
    let tri = 0; model.traverse(o => { if (o.isMesh) tri += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    $('info').textContent = `${name} · ${Math.round(tri).toLocaleString('tr')} üçgen · ${g.animations.length} animasyon` + (tri > 60000 ? ' · ⚠️ oyun için ağır, daha az poligonlu iste' : '');
  }, undefined, e => { $('info').textContent = 'Açılamadı: ' + e.message; });
}
const use = f => { if (f) load(URL.createObjectURL(f), f.name); };
$('f').onchange = e => use(e.target.files[0]);
addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => { e.preventDefault(); use(e.dataTransfer.files[0]); });
let dr = null; R.domElement.addEventListener('pointerdown', e => dr = [e.clientX, e.clientY]); addEventListener('pointerup', () => dr = null);
addEventListener('pointermove', e => { if (!dr) return; yaw -= (e.clientX - dr[0]) * .01; pitch = Math.max(-.3, Math.min(1.2, pitch + (e.clientY - dr[1]) * .006)); dr = [e.clientX, e.clientY]; });
R.domElement.addEventListener('wheel', e => { dist = Math.max(.6, Math.min(10, dist * (1 + Math.sign(e.deltaY) * .1))); }, { passive: true });
const clock = new THREE.Clock();
R.setAnimationLoop(() => { const dt = clock.getDelta(); if (mixer) mixer.update(dt); if (!dr) yaw += dt * .25; cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, H * .55 + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(0, H * .5, 0); R.render(S, cam); });
</script></body></html>
