<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kapıyı Açma — Ördekez</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",ui-monospace,monospace;color:#e8e2d4;user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none!important}
  .panel{background:rgba(10,9,8,.88);border:1px solid rgba(232,226,212,.35);box-shadow:0 8px 30px rgba(0,0,0,.6)}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}
  #prompt{position:fixed;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-weight:700;font-size:16px;text-shadow:0 2px 4px #000;pointer-events:none;white-space:nowrap}
  #prompt kbd{display:inline-block;border:1px solid #e8e2d4;border-radius:3px;padding:0 6px;margin-right:6px;font-size:13px}
  #obj{position:fixed;left:18px;top:16px;max-width:42vw;padding:9px 14px;font-size:15px;line-height:1.4}
  #obj b{color:#f1c470;letter-spacing:.12em;font-size:12px;display:block;margin-bottom:2px}
  #stats{position:fixed;right:18px;top:16px;display:flex;gap:8px;font-weight:700;font-size:15px}
  #stats div{padding:7px 12px}
  #sNote{cursor:pointer}
  #note{position:fixed;right:18px;top:64px;width:min(380px,40vw);padding:14px 18px;line-height:1.45;font-size:14px}
  #note h3{margin:0 0 8px;letter-spacing:.12em;color:#f1c470;font-size:14px}
  #note li{margin:5px 0}
  #note .x{opacity:.4}
  #dlg{position:fixed;left:50%;bottom:5%;transform:translateX(-50%);width:min(880px,90vw);padding:16px 22px 18px;font-size:18px;line-height:1.45;box-sizing:border-box}
  #dlg .nm{font-weight:900;letter-spacing:.14em;color:#f1c470;font-size:13px;margin-bottom:4px}
  #dlg .tx{min-height:2.9em;white-space:pre-wrap}
  #dlg .more{position:absolute;right:14px;bottom:6px;font-size:11px;opacity:.55}
  #dlg .ch{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  #dlg .ch:empty{display:none}
  #dlg .ch button{font:inherit;font-size:16px;text-align:left;color:#e8e2d4;background:rgba(255,255,255,.05);border:1px solid rgba(232,226,212,.3);padding:7px 12px;cursor:pointer}
  #dlg .ch button:hover{background:#e8e2d4;color:#111}
  #dlg .ch button:disabled{opacity:.3;cursor:default;background:none;color:#e8e2d4}
  #dlg .ch button.g{border-color:#8fc46a;color:#bfe39d}#dlg .ch button.g:hover{background:#8fc46a;color:#111}
  #dlg .ch button.r{border-color:#d0463a;color:#ff9a8a}#dlg .ch button.r:hover{background:#d0463a;color:#111}
  #close{position:fixed;left:50%;top:6%;transform:translateX(-50%);width:min(620px,60vw);aspect-ratio:16/10;border:1px solid rgba(232,226,212,.35);box-shadow:0 10px 40px #000;background:#000}
  #close canvas{width:100%;height:100%;display:block}
  .scrn{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.72)}
  .scrn h1{font-size:min(9vw,84px);margin:0 0 4px;letter-spacing:.08em;color:#e8e2d4;text-shadow:0 0 30px rgba(200,40,30,.35)}
  .scrn h2{letter-spacing:.14em;margin:0 0 8px}
  .scrn .sub{opacity:.7;margin-bottom:16px;text-align:center;max-width:680px;line-height:1.6}
  .mbtn{font:700 16px "Courier New",monospace;min-width:230px;color:#e8e2d4;background:rgba(255,255,255,.04);border:1px solid rgba(232,226,212,.45);padding:10px 18px;cursor:pointer;letter-spacing:.08em;box-sizing:border-box}
  .mbtn:hover{background:#e8e2d4;color:#111}.mbtn:disabled{opacity:.3;cursor:default;background:none;color:#e8e2d4}
  #menu{background:radial-gradient(ellipse at 50% 60%,rgba(40,20,12,.45),rgba(0,0,0,.9))}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s}
  #fade.on{opacity:1}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);padding:8px 16px;font-weight:700;transition:opacity .4s}
  #end{background:rgba(0,0,0,.9)}
  #end p{max-width:620px;text-align:center;line-height:1.6;font-size:17px}
  body.peep #dlg{left:auto;right:4%;top:16%;bottom:auto;transform:none;width:min(560px,44vw);background:rgba(0,10,8,.88);border-color:rgba(90,220,190,.45);color:#a8f0dc;font-size:20px}
  body.peep #dlg .nm{color:#5fe0c0}
  body.peep #dlg .ch button{color:#a8f0dc;border-color:rgba(90,220,190,.4);background:rgba(0,30,24,.6);font-size:17px}
  body.peep #dlg .ch button:hover{background:#5fe0c0;color:#001}
  body.peep #close{left:4%;top:auto;bottom:5%;transform:none;width:min(420px,34vw);filter:sepia(1) hue-rotate(110deg) saturate(1.6) brightness(.9)}
  label{font-size:14px;display:flex;gap:10px;align-items:center}
  #mob{position:fixed;inset:auto 0 0 0;padding:10px;text-align:center;background:#300;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross" class="hidden"></div>
<div id="prompt"></div>
<div id="obj" class="panel hidden"><b>GÖREV</b><span></span></div>
<div id="stats" class="hidden"><div class="panel" id="sTime">GECE 1</div><div class="panel" id="sEn">⚡ 2</div><div class="panel" id="sAm">🔫 2</div><div class="panel" id="sNote">📓 İşaretler (N)</div></div>
<div id="note" class="panel hidden"></div>
<div id="close" class="hidden"><canvas width="960" height="600"></canvas></div>
<div id="dlg" class="panel hidden"><div class="nm"></div><div class="tx"></div><div class="ch"></div><div class="more">tıkla / E ▶</div></div>
<div id="toast" class="panel hidden"></div>
<div id="menu" class="scrn">
  <h1>KAPIYI AÇMA</h1>
  <div class="sub">Gündüz güneş öldürür. Gece kapını çalanların hepsi insan değil.<br><br>WASD yürü · Fare bak · E etkileşim · N işaretler · Esc duraklat</div>
  <button class="mbtn" id="mNew">YENİ OYUN</button>
  <button class="mbtn" id="mCont">DEVAM ET</button>
  <a class="mbtn" href="index.html" style="text-align:center;text-decoration:none">← ÖRDEKEZ</a>
</div>
<div id="pause" class="scrn hidden">
  <h2>DURAKLATILDI</h2>
  <button class="mbtn" id="pGo">DEVAM</button>
  <button class="mbtn" id="pMenu">ANA MENÜ</button>
  <label>Ses <input type="range" id="vol" min="0" max="1" step=".05" value=".8"></label>
  <label>Fare hassasiyeti <input type="range" id="sens" min=".3" max="2.5" step=".1" value="1"></label>
</div>
<div id="end" class="scrn hidden"></div>
<div id="fade"></div>
<div id="mob" class="hidden">Bu oyun klavye ve fare ile oynanır. Bilgisayardan gir.</div>

<script type="module">
import * as THREE from './three-uzay.js';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rand = (a, b) => a + Math.random() * (b - a);
if (matchMedia('(pointer: coarse)').matches) $('mob').classList.remove('hidden');

/* =====================================================================
   RENDER — gerçekçi ışık (ACES tonlama, gölge), film greni,
   gözetleme deliği için balık gözü + dairesel maske
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);   // performans: 1x çözünürlük, gölge yok
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = false;
const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType });
const postMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: rt.texture }, time: { value: 0 }, peep: { value: 0 }, aspect: { value: 1 }, flash: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tex; uniform float time, peep, aspect, flash; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
    void main(){
      vec2 q = vUv - .5; vec2 uv = vUv; vec3 c;
      if (peep > 0.) {
        vec2 e = q * 2.; float r2 = dot(e, e);
        uv = .5 + q * (.84 + .2 * r2);                      // balık gözü
        c = texture2D(tex, uv).rgb;
        float l = dot(c, vec3(.3, .59, .11));
        l += (h(vUv * 640. + fract(time * 7.) * 91.) - .5) * .08;   // gece görüşü karıncalanması
        c = vec3(.18, .95, .72) * l * 1.15 + vec3(.0, .02, .015);
        c *= smoothstep(1.12, .86, length(e * vec2(.92, 1.05)));   // oval mercek kenarı
        c *= .92 + .08 * sin(vUv.y * 900. + time * 30.);
      } else {
        c = texture2D(tex, uv).rgb; c = aces(c * 1.1); c = pow(c, vec3(1. / 2.2));
        vec2 qa = q; qa.x *= aspect; c *= 1. - dot(qa, qa) * .75;
        c += (h(vUv * 917. + fract(time) * 31.) - .5) * .045;
      }
      c = mix(c, vec3(1., .95, .85), flash);
      gl_FragColor = vec4(c, 1.);
    }`
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
renderer.toneMapping = THREE.NoToneMapping; renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // tonlama son aşamada (post)
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020203); scene.fog = new THREE.Fog(0x020203, 6, 18);
const camera = new THREE.PerspectiveCamera(70, 1, .05, 60); camera.rotation.order = 'YXZ'; scene.add(camera);
function resize() { const w = innerWidth, h = innerHeight, pr = renderer.getPixelRatio(); renderer.setSize(w, h, false); rt.setSize(Math.floor(w * pr), Math.floor(h * pr)); camera.aspect = w / h; camera.updateProjectionMatrix(); postMat.uniforms.aspect.value = w / h; }
addEventListener('resize', resize); resize();

/* ---------- dokular ---------- */
function ctex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t;
}
function noise(g, w, h, base, amt, n = 4000, sz = 2) { if (base) { g.fillStyle = base; g.fillRect(0, 0, w, h); } for (let i = 0; i < n; i++) { const v = (Math.random() - .5) * amt; g.fillStyle = v > 0 ? `rgba(255,255,255,${v})` : `rgba(0,0,0,${-v})`; g.fillRect(Math.random() * w, Math.random() * h, sz, sz); } }
function stains(g, w, h, n, col) { for (let i = 0; i < n; i++) { const x = Math.random() * w, y = Math.random() * h, r = 10 + Math.random() * 60; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); } }
const TX = {
  // eski, sararmış çizgili duvar kâğıdı + rutubet lekeleri + alt kısımda kir
  wallpaper: ctex(512, 512, (g, w, h) => { noise(g, w, h, '#5e5644', .07, 14000, 2);
    for (let x = 0; x < w; x += 64) { g.fillStyle = 'rgba(30,24,14,.22)'; g.fillRect(x, 0, 22, h); g.fillStyle = 'rgba(255,240,200,.04)'; g.fillRect(x + 30, 0, 4, h); }
    g.globalAlpha = .16; for (let x = 0; x < w; x += 64) for (let y = 0; y < h; y += 80) { g.fillStyle = '#2a2014'; g.beginPath(); g.moveTo(x + 43, y + 10); g.bezierCurveTo(x + 60, y + 30, x + 60, y + 50, x + 43, y + 70); g.bezierCurveTo(x + 26, y + 50, x + 26, y + 30, x + 43, y + 10); g.fill(); }
    g.globalAlpha = 1; stains(g, w, h, 10, 'rgba(60,45,20,.35)'); stains(g, w, h, 5, 'rgba(20,25,15,.4)');
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(.15, 'rgba(0,0,0,0)'); gr.addColorStop(.8, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,6,0,.55)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 4; i++) { const x = Math.random() * w; g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (Math.random() - .5) * 30, h); g.stroke(); } }),
  wallK: ctex(256, 256, (g, w, h) => { noise(g, w, h, '#6e6c62', .07, 5000); for (let y = 0; y < h; y += 32) for (let x = 0; x < w; x += 32) { g.fillStyle = `rgba(255,255,240,${.03 + Math.random() * .05})`; g.fillRect(x + 1, y + 1, 30, 30); } g.strokeStyle = 'rgba(30,28,20,.6)'; g.lineWidth = 1.5; for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); } stains(g, w, h, 6, 'rgba(50,40,20,.35)'); }),
  // balıksırtı parke, aşınmış
  floor: ctex(512, 512, (g, w, h) => { g.fillStyle = '#2a1c10'; g.fillRect(0, 0, w, h); const L = 64, T = 16;
    for (let y = -L; y < h + L; y += T) for (let x = -L; x < w + L; x += L * 2) for (const d of [0, 1]) { g.save(); g.translate(x + d * L + (y / T % 2) * T, y); g.rotate(d ? -Math.PI / 4 : Math.PI / 4); const c = 60 + Math.random() * 30; g.fillStyle = `rgb(${c + 30},${c + 8},${c - 18})`; g.fillRect(0, 0, L, T - 1.5); for (let k = 0; k < 6; k++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .15})`; g.fillRect(Math.random() * L, Math.random() * T, 20, 1); } g.restore(); }
    stains(g, w, h, 8, 'rgba(0,0,0,.25)'); noise(g, w, h, null, .06, 6000); }),
  tile: ctex(256, 256, (g, w, h) => { for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const c = (x + y) % 2 ? 150 : 70; g.fillStyle = `rgb(${c + 8},${c + 4},${c - 6})`; g.fillRect(x * 32, y * 32, 32, 32); } g.strokeStyle = 'rgba(20,18,12,.7)'; for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); } stains(g, w, h, 8, 'rgba(30,25,10,.35)'); noise(g, w, h, null, .08, 4000); }),
  ceil: ctex(256, 256, (g, w, h) => { noise(g, w, h, '#8a867a', .06, 6000); stains(g, w, h, 6, 'rgba(90,70,30,.35)'); g.strokeStyle = 'rgba(40,35,25,.4)'; for (let i = 0; i < 5; i++) { g.beginPath(); let x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (Math.random() - .5) * 50; y += (Math.random() - .5) * 50; g.lineTo(x, y); } g.stroke(); } }),
  rug: ctex(512, 512, (g, w, h) => { noise(g, w, h, '#4a1814', .1, 12000); g.strokeStyle = '#8a6a3a'; g.lineWidth = 10; g.strokeRect(20, 20, w - 40, h - 40); g.lineWidth = 3; g.strokeRect(46, 46, w - 92, h - 92); for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? '#1e2a36' : '#7a5a2a'; g.beginPath(); g.moveTo(w / 2, 90 + i * 12); g.lineTo(w - 120 - i * 10, h / 2); g.lineTo(w / 2, h - 90 - i * 12); g.lineTo(120 + i * 10, h / 2); g.closePath(); g.fill(); } noise(g, w, h, null, .12, 10000); stains(g, w, h, 6, 'rgba(0,0,0,.35)'); }),
  wood: ctex(256, 128, (g, w, h) => { noise(g, w, h, '#3a2616', .1, 3000); for (let y = 0; y < h; y += 4) { g.fillStyle = `rgba(0,0,0,${.08 + Math.random() * .12})`; g.fillRect(0, y + Math.random() * 3, w, 1 + Math.random()); } for (let i = 0; i < 4; i++) { g.strokeStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 10, 4, 0, 0, 7); g.stroke(); } }),
  plank: ctex(256, 64, (g, w, h) => { noise(g, w, h, '#5a3e24', .14, 2500); for (let y = 0; y < h; y += 3) { g.fillStyle = `rgba(0,0,0,${Math.random() * .12})`; g.fillRect(0, y, w, 1); } g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0, 0, w, 3); g.fillRect(0, h - 3, w, 3); g.fillStyle = '#1a1a1a'; g.beginPath(); g.arc(14, h / 2, 4, 0, 7); g.arc(w - 14, h / 2, 4, 0, 7); g.fill(); }),
  door: ctex(256, 512, (g, w, h) => { noise(g, w, h, '#3e2a1a', .1, 8000); for (let y = 0; y < h; y += 5) { g.fillStyle = `rgba(0,0,0,${Math.random() * .1})`; g.fillRect(0, y, w, 1); } g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 8; g.strokeRect(32, 36, w - 64, 200); g.strokeRect(32, 272, w - 64, 200); g.strokeStyle = 'rgba(255,220,180,.08)'; g.lineWidth = 3; g.strokeRect(38, 42, w - 76, 188); g.strokeRect(38, 278, w - 76, 188); stains(g, w, h, 4, 'rgba(0,0,0,.3)'); }),
  fabricR: ctex(128, 128, (g, w, h) => { noise(g, w, h, '#4a2420', .12, 5000); for (let y = 0; y < h; y += 3) { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, y, w, 1); } stains(g, w, h, 3, 'rgba(0,0,0,.3)'); }),
  fabricG: ctex(128, 128, (g, w, h) => { noise(g, w, h, '#2a3428', .12, 5000); for (let x = 0; x < w; x += 3) { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(x, 0, 1, h); } stains(g, w, h, 3, 'rgba(0,0,0,.3)'); }),
  curtain: ctex(128, 256, (g, w, h) => { for (let x = 0; x < w; x++) { const v = 40 + Math.sin(x / 6) * 18; g.fillStyle = `rgb(${v + 30},${v},${v - 6})`; g.fillRect(x, 0, 1, h); } noise(g, w, h, null, .1, 3000); stains(g, w, h, 3, 'rgba(0,0,0,.35)'); }),
};
const std = (o, rough = .85) => new THREE.MeshStandardMaterial(Object.assign({ roughness: rough, metalness: 0 }, typeof o === 'object' && !o.isTexture && !o.isColor ? o : (o && o.isTexture ? { map: o } : { color: o })));
const fabric = c => std(c === '#6a3a34' ? TX.fabricR : c === '#3a4a3a' ? TX.fabricG : ctex(64, 64, (g, w, h) => noise(g, w, h, c, .12, 1500)), .95);
const M = { wood: std(TX.wood, .6), plank: std(TX.plank), metal: std({ color: 0x8a8c8e, metalness: .6, roughness: .4 }), door: std(TX.door, .6), dark: std(0x1a1816) };

/* =====================================================================
   EV — hol (kapı), salon (TV, kanepe), mutfak, yatak odası
   ===================================================================== */
const H = 2.7, solids = [], inter = [], occ = [];
function box(w, h, d, mat, x, y, z, par = scene, shadow = true) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; par.add(m); return m; }
function solid(x0, x1, z0, z1) { solids.push([Math.min(x0, x1), Math.max(x0, x1), Math.min(z0, z1), Math.max(z0, z1)]); }
function texMat(tex, rx, ry, rough = .85) { const t = tex.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return std(t, rough); }
function wall(x0, x1, z0, z1, tex = TX.wallpaper, y0 = 0, y1 = H) {
  const w = Math.max(.1, Math.abs(x1 - x0)), d = Math.max(.1, Math.abs(z1 - z0));
  const b = box(w, y1 - y0, d, texMat(tex, Math.max(w, d) / 2.2, (y1 - y0) / 2.4), (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, scene, false); occ.push(b);
  if (y0 < 1.2) solid(x0 - .03, x1 + .03, z0 - .03, z1 + .03); return b;
}

  if (letIn) {
    endPeep(); doorTarget = 1; SND.door();
    say(c.ad, c.yes, null, () => {
      G.guests.push(id); G.seat[id] = freeSeat(); G.vi++; visitorP = null; doorTarget = 0; setTimeout(() => SND.slam(), 300);
      spawnGuests(); save(); toast(`${c.ad} salona geçip oturdu.`, 2.5); nightStep();
    });
  } else {
    const nm = G.asked && G.asked.who ? c.ad : '???';
    say(nm, c.no, null, () => { endPeep(); if (!c.v) G.karma--; G.vi++; visitorP = null; save(); nightStep(); });
  }
}
// uyku: gece → sabah (ziyaretçiler insanları alır) ; gündüz → akşam
function sleep() {
  $('fade').classList.add('on'); state = 'busy'; unlockPointer(); toggleNote(false); objective('');
  setTimeout(() => {
    if (G.phase === 'night') {
      const vis = G.guests.filter(id => CHARS[id].v), hum = G.guests.filter(id => !CHARS[id].v), gone = [];
      for (const v of vis) { const left = hum.filter(h => !gone.includes(h)); if (!left.length) break; gone.push(left[Math.floor(Math.random() * left.length)]); }
      for (const h of gone) { const [x, z] = SEATS[G.seat[h]]; G.stains.push([x, z]); delete G.seat[h]; }
      G.guests = G.guests.filter(id => !gone.includes(id)); G.dead.push(...gone);
      G.phase = 'day'; G.energy = 2; G.tvDone = false; save(); spawnGuests(); setDay(true);
      P.pos.set(3.2, 0, -.4); P.yaw = -Math.PI / 2; P.pitch = 0; state = 'play'; $('fade').classList.remove('on'); hud();
      const lines = [['', `GÜN ${G.night}. Uyandın. Tahtaların arasından ölümcül güneş sızıyor.`]];
      for (const h of gone) lines.push(['', `Gece salondan bir çığlık gelmişti... ${CHARS[h].ad} yerinde yok. Oturduğu yerde simsiyah, ıslak bir iz var.`]);
      if (!gone.length && G.night > 1) lines.push(['', 'Sabah herkes yerindeydi. Şimdilik.']);
      if (vis.length && G.guests.length && !G.guests.some(id => !CHARS[id].v) && G.night >= 2) { sayMany(lines, () => ending('icerde')); return; }
      sayMany(lines, dayStart);
    } else {
      if (G.night >= LAST) { state = 'play'; $('fade').classList.remove('on'); return finale(); }
      G.night++; G.vi = 0; G.phase = 'night'; save(); setDay(false); spawnGuests();
      P.pos.set(3.2, 0, -.4); P.yaw = -Math.PI / 2; P.pitch = 0; state = 'play'; $('fade').classList.remove('on'); hud();
      say('', `GECE ${G.night}. Karanlık çöktü. Kapıya kulak ver.`, null, nightStep);
    }
  }, 1100);
}
function dayStart() { objective('Salona git ve televizyondaki haberleri izle (E).'); hud(); }
function afterNews() { objective(G.guests.length ? 'Misafirlerine yaklaş ve E: konuş, incele (⚡), gerekirse vur. Hazır olunca yatağa git.' : 'Evde kimse yok. Yatağa git ve akşamı bekle.'); hud(); }
function watchNews() {
  const ns = SIGN_ORDER[G.night]; tvMode = 'news'; SND.tv();
  const lines = [['TV', 'Acil durum yayını devam ediyor.']];
  if (ns && !G.known.includes(ns)) lines.push(['TV', 'YENİ İŞARET: ' + SIGNS[ns].tv]);
  lines.push(['TV', 'Tek bir işarete güvenmeyin. Yorgunluk, kir, hastalık da benzer belirtiler gösterebilir.']);
  sayMany(lines, () => { tvMode = 'off'; if (ns && !G.known.includes(ns)) G.known.push(ns); G.tvDone = true; save(); toggleNote(true); afterNews(); });
}
// inceleme
function startInspect(id) {
  insp = id; unlockPointer(); toggleNote(false); const p = people[id];
  const hp = p.g.position.clone(); hp.y = p.hgt * .9;
  const dir = new THREE.Vector3(hp.x - P.pos.x, hp.y + .1 - P.eye, hp.z - P.pos.z); P.yaw = Math.atan2(-dir.x, -dir.z); P.pitch = Math.atan2(dir.y, Math.hypot(dir.x, dir.z));
  camera.rotation.set(P.pitch, P.yaw, 0); hud(); inspMenu();
}
function inspMenu() {
  const id = insp, c = CHARS[id]; if (!id) return;
  const opts = [{ t: '💬 Konuş', f: () => say(c.ad, c.talk, null, inspMenu) }];
  SIGN_ORDER.forEach(s => opts.push({ t: `🔍 ${SIGNS[s].look} (⚡1)${G.known.includes(s) ? '' : '  — bu işareti henüz bilmiyorsun'}`, dis: G.energy <= 0, f: () => {
    G.energy--; hud(); SND.look(); paintClose(id, s); const has = c.s.includes(s);
    const msg = { goz: has ? 'Gözleri kıpkırmızı. Damarlar patlamış.' : 'Gözleri normal. Biraz yorgun.', dis: has ? 'Dişleri bembeyaz ve kusursuz. Tek bir leke, tek bir çatlak yok.' : 'Dişleri sararmış, biri çarpık. Sıradan.', tirnak: has ? 'Tırnak altları kapkara.' : 'Tırnakları temiz.', koltuk: has ? 'Koltuk altında tek bir kıl yok. Deri kızarmış, pul pul.' : 'Kıllı, sıradan bir koltuk altı.' }[s];
    say(c.ad, msg, null, () => { $('close').classList.add('hidden'); save(); inspMenu(); });
  } }));
  opts.push({ t: `🔫 Vur (${G.ammo} mermi)`, cls: 'r', dis: G.ammo <= 0, f: () => menuDlg('', `${c.ad}'i gerçekten vuracak mısın? Geri dönüşü yok.`, [{ t: 'Evet, vur.', cls: 'r', f: () => shoot(id) }, { t: 'Vazgeç', f: inspMenu }]) });
  opts.push({ t: '← Bırak', f: endInspect });
  menuDlg(c.ad, G.energy > 0 ? `Ne yapacaksın? (Bugün ${G.energy} inceleme hakkın kaldı)` : 'Ne yapacaksın? (Bugünlük inceleme hakkın bitti)', opts);
}
function endInspect() { closeDlg(); $('close').classList.add('hidden'); insp = null; hud(); lockPointer(); }
function shoot(id) {
  const c = CHARS[id], p = people[id]; G.ammo--; SND.shot(); postMat.uniforms.flash.value = 1; hud();
  p.mesh.rotation.z = .5; p.mesh.position.y = -.2; p.mat.color.setRGB(c.v ? .25 : .8, c.v ? .05 : .4, c.v ? .05 : .4);
  if (c.v) setTimeout(() => SND.sting(), 400);
  const done = () => { const [x, z] = SEATS[G.seat[id]]; G.stains.push([x, z]); delete G.seat[id]; G.guests = G.guests.filter(x => x !== id); G.shot.push(id); save(); spawnGuests(); endInspect(); };
  if (c.v) say('', `${c.ad} yığıldı. Yüzü... yüzü eriyip kayıyor. Altındaki şey insan değildi.`, null, done);
  else { G.karma -= 3; say('', `${c.ad} yığıldı. Kan kırmızıydı. Sıcaktı. ...O bir insandı.`, null, done); }
}
function finale() {
  const vis = G.guests.filter(id => CHARS[id].v), hum = G.guests.filter(id => !CHARS[id].v);
  SND.knock(); objective('');
  sayMany([['', 'Üçüncü günün akşamı kapı çalındı. Bu sefer farklı: düzenli, sert vuruşlar.'], ['DIŞARIDAN', 'Kurtarma ekibi! Evde insan varsa kapıyı açın!']], () => vis.length ? ending('kotu', vis) : hum.length ? ending('iyi', hum) : ending('yalniz'));
}
function ending(kind, list = []) {
  state = 'end'; closeDlg(); unlockPointer(); localStorage.removeItem(SAVE);
  const names = list.map(id => CHARS[id].ad).join(', ');
  const T = {
    iyi: ['🌅 SABAH', `Kapıyı açtın. Ekip evdekileri tek tek kontrol etti: ${names}. Hepsi insan. Hepsi hayatta.${G.karma < 0 ? '<br><br>Ama kapıdan çevirdiklerini ve vurduklarını unutamayacaksın.' : ''}`],
    yalniz: ['🕯️ YALNIZ', 'Kapıyı açtın. Ekip boş evi gördü. Hayattaydın. Ama yanında kimse yoktu. Belki de en güvenlisi buydu.'],
    kotu: ['👁️ KAPIYI AÇMA', `Kapıyı açtığında arkandan bir ses geldi. ${names} gülümsüyordu. Kusursuz, bembeyaz dişlerle.<br><br>Kurtarma ekibi içeri girdiğinde evde kimse yoktu. İnsan olan kimse.`],
    icerde: ['👁️ SABAH OLMADI', 'Evde artık senden başka insan kalmamıştı. Bu gece kimse kapıyı çalmadı. Zaten içerideydiler.'],
  }[kind];
  (kind === 'iyi' ? SND.door : SND.sting)();
  const el = $('end'); el.innerHTML = `<h2>${T[0]}</h2><p>${T[1]}</p><p style="opacity:.6;font-size:14px">Kaybedilen: ${G.dead.length} · Vurulan: ${G.shot.length}</p><button class="mbtn" id="eMenu">ANA MENÜ</button>`; el.classList.remove('hidden'); hud();
  $('eMenu').onclick = () => { el.classList.add('hidden'); toMenu(); };
}
function toMenu() { clearTimeout(nightTimer); state = 'menu'; closeDlg(); endPeep(); insp = null; $('close').classList.add('hidden'); unlockPointer(); clearPeople(); G = null; objective(''); hud(); $('menu').classList.remove('hidden'); $('mCont').disabled = !load(); }
$('mNew').onclick = () => { localStorage.removeItem(SAVE); startGame(fresh()); };
$('mCont').onclick = () => { const s = load(); if (s) startGame(s); };
$('mCont').disabled = !load();

/* ---------- oyuncu ---------- */
function collide(x, z) { const r = .26; for (const [x0, x1, z0, z1] of solids) if (x > x0 - r && x < x1 + r && z > z0 - r && z < z1 + r) return true; return false; }
let stepAcc = 0;
function updatePlayer(dt) {
  if (peepOn) return;
  if (state === 'play' && !dlg && !insp) {
    let fx = 0, fz = 0;
    if (keys.KeyW || keys.ArrowUp) fz -= 1; if (keys.KeyS || keys.ArrowDown) fz += 1;
    if (keys.KeyA || keys.ArrowLeft) fx -= 1; if (keys.KeyD || keys.ArrowRight) fx += 1;
    const l = Math.hypot(fx, fz); if (l) { fx /= l; fz /= l; }
    const sp = (keys.ShiftLeft ? 2.6 : 1.7) * dt, sn = Math.sin(P.yaw), cs = Math.cos(P.yaw);
    const dx = (fx * cs + fz * sn) * sp, dz = (-fx * sn + fz * cs) * sp;
    if (!collide(P.pos.x + dx, P.pos.z)) P.pos.x += dx; if (!collide(P.pos.x, P.pos.z + dz)) P.pos.z += dz;
    P.pos.x = clamp(P.pos.x, -6.75, 5.75); P.pos.z = clamp(P.pos.z, -2.75, 6.8);
    if (l) { P.bob += dt * 9; stepAcc += sp; if (stepAcc > .75) { stepAcc = 0; SND.step(); } }
  }
  camera.position.set(P.pos.x, P.eye + Math.sin(P.bob) * .025, P.pos.z); camera.rotation.set(P.pitch, P.yaw, 0);
}

/* ---------- TV ekranı ---------- */
function drawTV(t) {
  const g = tvCv.getContext('2d'), w = 256, h = 192;
  if (tvMode === 'off') { g.fillStyle = '#0a0c0c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 300; i++) { const v = Math.random() * 60; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 1); } tvGlow.intensity = .3; }
  else { g.fillStyle = '#1a2a3a'; g.fillRect(0, 0, w, h); g.fillStyle = '#a01e18'; g.fillRect(0, 0, w, 34); g.fillStyle = '#fff'; g.font = 'bold 18px sans-serif'; g.textAlign = 'center'; g.fillText('ACİL DURUM YAYINI', w / 2, 24);
    g.fillStyle = '#3a4650'; g.beginPath(); g.ellipse(w / 2, 104, 30, 38, 0, 0, 7); g.fill(); g.fillRect(w / 2 - 60, 136, 120, 60);
    g.fillStyle = '#ffd040'; g.fillRect(0, h - 26, w, 26); g.fillStyle = '#111'; g.font = 'bold 13px sans-serif'; g.textAlign = 'left'; g.fillText('DIŞARI ÇIKMAYIN • KAPIYI AÇMAYIN • '.repeat(3), 10 - (t * 60) % 290, h - 9);
    tvGlow.intensity = 2 + Math.sin(t * 9) * .3; }
  for (let y = 0; y < h; y += 3) { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, y, w, 1); }
  tvTex.needsUpdate = true;
}

/* ---------- döngü ---------- */
let last = performance.now(), menuT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (state === 'menu') { menuT += dt; camera.position.set(-.2 + Math.sin(menuT * .2) * .1, 1.6, 4.6); camera.rotation.set(-.04, Math.sin(menuT * .15) * .08, 0); }
  else updatePlayer(dt);
  if (dlg && !dlg.done) { dlg.i = Math.min(dlg.text.length, dlg.i + dt * 55); $('dlg').querySelector('.tx').textContent = dlg.text.slice(0, Math.floor(dlg.i)); }
  if (dlg && !dlg.done && dlg.i >= dlg.text.length) { dlg.done = true; $('dlg').querySelector('.tx').textContent = dlg.text; if (dlg.choices) showChoices(); else $('dlg').querySelector('.more').style.display = ''; }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) { $('toast').style.opacity = 0; setTimeout(() => { if (toastT <= 0) $('toast').classList.add('hidden'); }, 400); } }
  doorOpen += (doorTarget - doorOpen) * Math.min(1, dt * 4); doorPiv.rotation.y = -doorOpen * 1.5;
  { const i = solids.indexOf(doorSolid); if (doorTarget && i >= 0) solids.splice(i, 1); else if (!doorTarget && i < 0) solids.push(doorSolid); }
  for (const p of Object.values(people)) { p.g.rotation.y = Math.atan2(camera.position.x - p.g.position.x, camera.position.z - p.g.position.z); if (CHARS[p.id].v) p.mesh.rotation.z = Math.sin(t * .5 + p.id.length) * .015; }
  for (const b of bulbs) { if (Math.random() < .004) b.f = .25; b.f = Math.max(0, b.f - dt); b.L.intensity = b.base * (G && G.phase === 'day' ? .5 : 1) * (b.f > 0 && Math.random() < .5 ? .25 : 1); }
  if (peepOn) drawPeep(t);
  drawTV(t);
  if (state === 'play' && !dlg && !peepOn && !insp) { focus = getFocus(); const pr = promptFor(focus); $('prompt').innerHTML = pr ? `<kbd>E</kbd>${pr}` : ''; } else { focus = null; $('prompt').innerHTML = ''; }
  postMat.uniforms.time.value = t; postMat.uniforms.flash.value = Math.max(0, postMat.uniforms.flash.value - dt * 2.2);
  if (!peepOn) { renderer.setRenderTarget(rt); renderer.render(scene, camera); } renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
requestAnimationFrame(frame);
window.__ni = { get G() { return G; }, startGame, fresh, CHARS, get state() { return state; }, P, interact, get focus() { return focus; }, startPeep, sleep, people: () => people, startInspect, paintClose, get dlg() { return dlg; }, camera };
</script>
