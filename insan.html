<script>
'use strict';
/* =====================================================================
   KAPIYI AÇMA — "No, I'm Not a Human" tarzı, 2D el çizimi
   Gece: kapıya gelenlerle konuş, içeri al ya da gönder.
   Gündüz: TV'den yeni işareti öğren, misafirleri incele (enerji), gerekirse vur.
   ===================================================================== */
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 960, H = 540;
const $ = id => document.getElementById(id);
const INK = '#17110c', PAPER = '#e9dfc8';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- el çizimi yardımcıları (çizgiler 140 ms'de bir "kaynar") ---------- */
let sd = 1, boil = 0;
function R() { sd = (sd * 16807) % 2147483647; return sd / 2147483647; }
function seedFor(k) { sd = ((boil * 7919 + k * 104729) % 2147483646) + 1; R(); R(); }
const jt = a => (R() - .5) * a;
function rline(x1, y1, x2, y2, w = 2.2, col = INK) {
  for (let k = 0; k < 2; k++) { g.beginPath(); g.moveTo(x1 + jt(2.2), y1 + jt(2.2)); g.quadraticCurveTo((x1 + x2) / 2 + jt(3.5), (y1 + y2) / 2 + jt(3.5), x2 + jt(2.2), y2 + jt(2.2)); g.lineWidth = w * (k ? .55 : 1); g.strokeStyle = col; g.lineCap = 'round'; g.stroke(); }
}
function rpoly(pts, fill, w = 2.4, col = INK) {
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x + jt(1.6), y + jt(1.6)) : g.moveTo(x + jt(1.6), y + jt(1.6))); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); } if (w) { g.lineWidth = w; g.strokeStyle = col; g.lineJoin = 'round'; g.stroke(); }
}
function rell(cx, cy, rx, ry, fill, w = 2.4, col = INK, a0 = 0, a1 = Math.PI * 2, n = 22) {
  const pts = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * rx * (1 + jt(.05)), cy + Math.sin(a) * ry * (1 + jt(.05))]); }
  if (a1 - a0 < 6.28) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); if (fill) { g.fillStyle = fill; g.fill(); } g.lineWidth = w; g.strokeStyle = col; g.stroke(); return; }
  rpoly(pts, fill, w, col);
}
function hatch(x, y, w, h, step = 7, col = 'rgba(23,17,12,.45)', ang = 1) {
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.strokeStyle = col; g.lineWidth = 1.3;
  for (let i = -h; i < w + h; i += step) { g.beginPath(); g.moveTo(x + i + jt(2), y + jt(2)); g.lineTo(x + i - h * ang + jt(2), y + h + jt(2)); g.stroke(); }
  g.restore();
}
function rrect(x, y, w, h, fill, lw = 2.4) { rpoly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, lw); }
function txt(s, x, y, size = 22, col = PAPER, align = 'center', font = 'bold') { g.font = `${font} ${size}px "Courier New",monospace`; g.textAlign = align; g.fillStyle = col; g.fillText(s, x, y); }
// kağıt dokusu + film grenli üst katman
const grain = []; for (let k = 0; k < 4; k++) { const c = document.createElement('canvas'); c.width = 240; c.height = 135; const q = c.getContext('2d'), d = q.createImageData(240, 135); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = Math.random() < .5 ? 22 : 0; } q.putImageData(d, 0, 0); grain.push(c); }
function overlay(t) {
  g.save(); g.globalAlpha = .55; g.imageSmoothingEnabled = false; g.drawImage(grain[boil % 4], 0, 0, W, H); g.restore();
  const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .85); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.65)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  if (flash > 0) { g.fillStyle = `rgba(255,240,210,${flash})`; g.fillRect(0, 0, W, H); }
  if (shake > 0) cv.style.transform = `translate(${jt(shake * 14)}px,${jt(shake * 14)}px)`; else cv.style.transform = '';
}

/* ---------- ses ---------- */
let AC = null, master = null;
function ac() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f1, f2, dur, vol, type = 'sine', delay = 0) { const c = ac(), t = c.currentTime + delay, o = c.createOscillator(), q = c.createGain(); o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur); q.gain.setValueAtTime(0, t); q.gain.linearRampToValueAtTime(vol, t + .01); q.gain.exponentialRampToValueAtTime(.0005, t + dur); o.connect(q); q.connect(master); o.start(t); o.stop(t + dur + .05); }
function noise(dur, vol, freq = 1200, type = 'lowpass', delay = 0) { const c = ac(), n = c.sampleRate * dur, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; const q = c.createGain(); q.gain.value = vol; s.connect(f); f.connect(q); q.connect(master); s.start(c.currentTime + delay); }
const SND = {
  knock() { for (let i = 0; i < 3; i++) { tone(140, 60, .12, .7, 'sine', i * .28); noise(.08, .5, 700, 'lowpass', i * .28); } },
  click() { tone(900, 500, .04, .12, 'square'); },
  door() { noise(.6, .25, 500); tone(220, 90, .5, .15, 'sawtooth'); },
  slam() { tone(95, 38, .45, .9); noise(.35, .9, 900); },
  tv() { noise(1.2, .12, 5000, 'highpass'); },
  shot() { noise(.5, 1.2, 2400); tone(160, 40, .4, .9); },
  sting() { noise(.9, .5, 1800, 'bandpass'); tone(900, 120, .9, .18, 'sawtooth'); },
  look() { tone(300, 420, .15, .08, 'triangle'); },
};
let amb = null;
function ambStart() { if (amb) return; const c = ac(), o1 = c.createOscillator(), o2 = c.createOscillator(), q = c.createGain(); o1.frequency.value = 52; o2.frequency.value = 52.6; o1.type = o2.type = 'sawtooth'; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160; q.gain.value = .045; o1.connect(f); o2.connect(f); f.connect(q); q.connect(master); o1.start(); o2.start(); amb = { o1, o2, q }; }

/* ---------- işaretler ---------- */
const SIGNS = {
  dis:    { ad: 'Dişler', tv: 'Ziyaretçilerin dişleri kusursuz, bembeyazdır. Fazla kusursuz.', check: 'Dişlerine bak', at: 'mouth' },
  goz:    { ad: 'Gözler', tv: 'Ziyaretçilerin gözleri kıpkırmızıdır, damarlar patlamış gibidir.', check: 'Gözlerine bak', at: 'eyes' },
  tirnak: { ad: 'Tırnaklar', tv: 'Ziyaretçilerin tırnak altları kapkara ve kirlidir.', check: 'Ellerine bak', at: 'hands' },
  koltuk: { ad: 'Koltuk altı', tv: 'Ziyaretçilerin koltuk altında hiç kıl yoktur; deri kızarık ve tahrişlidir.', check: 'Koltuk altına bak', at: 'arm' },
};
const SIGN_ORDER = ['dis', 'goz', 'tirnak', 'koltuk'];   // gece 1 öncesi, sabah 1, 2, 3

/* ---------- karakterler (geçici çizimler; sonra kullanıcının çizimleriyle değişecek) ---------- */
// v: ziyaretçi mi; s: gösterdiği işaretler (insanlarda yanıltıcı tek işaret olabilir)
const CHARS = {
  remzi:  { ad: 'Remzi', look: { skin: '#d9b08c', hair: '#9a948a', style: 'cap', cap: '#3a4a6a', shirt: '#4a5a7a', old: 1, mustache: 1 }, v: 0, s: [],
            who: 'Remzi. Mahallenin postacısıyım, beni tanırsın.', why: 'Evime yetişemedim. Güneş doğmadan bir yere sığınmam lazım. Bir gece... sadece bir gece.',
            yes: 'Allah razı olsun evladım. Ayakkabılarımı çıkarırım, merak etme.', no: 'Anlıyorum... Herkes korkuyor. Kendine iyi bak.', talk: 'Kırk yıl mektup taşıdım. Hiçbir mektup bu kadar korkutmadı beni.' },
  selin:  { ad: 'Selin', look: { skin: '#e6c2a4', hair: '#2a1a14', style: 'long', shirt: '#a8322c', young: 1 }, v: 1, s: ['dis', 'koltuk'],
            who: 'Selin. Karşı apartmandan. Hatırlamadın mı? Hatırlamadın mı?', why: 'Evim artık güvenli değil. İçeri al beni. Lütfen. Lütfen. Lütfen.',
            yes: 'Teşekkürler. Burası çok... sıcak. Çok güzel.', no: '...Kapını hatırlayacağım.', talk: 'Uyuyamıyorum. Hiç uyumadım aslında. Sen uyurken izleyebilir miyim?' },
  doruk:  { ad: 'Doruk', look: { skin: '#f0cfb0', hair: '#5a3a1c', style: 'messy', shirt: '#3a7a4a', kid: 1 }, v: 0, s: [],
            who: 'Doruk... Annem "kapıları çal" dedi. Sonra gitti.', why: 'Dışarısı çok karanlık. Biri beni takip ediyor gibi.',
            yes: 'Teşekkür ederim abi... Burada uyuyabilir miyim?', no: '(Ağlamaya başlıyor. Adımları uzaklaşıyor.)', talk: 'Annem gelecek mi sence? Pencereye bakıp duruyorum.' },
  kadir:  { ad: 'Kadir', look: { skin: '#c8956a', hair: '#1a1410', style: 'short', shirt: '#5a5a3a', beard: 1 }, v: 0, s: ['tirnak'],
            who: 'Kadir, sanayideki tamirci. Ellerime bakma, bütün gün motor söktüm.', why: 'Dükkânın kepenkleri kapanmıyor. Orada kalırsam sabahı görmem.',
            yes: 'Sağ ol usta. Bir şey bozulursa bana söyle, tamir ederim.', no: 'Peki. Kapını sağlam kilitle bari.', talk: 'Tırnaklarımdaki yağ çıkmıyor işte. Otuz yıldır çıkmıyor.' },
  nilay:  { ad: 'Nilay', look: { skin: '#e8d0bc', hair: '#c8a060', style: 'bun', shirt: '#e8ecee', nurse: 1, young: 1 }, v: 1, s: ['goz', 'dis', 'tirnak'],
            who: 'Hemşire Nilay. Hastanede... herkes gitti. Herkes.', why: 'Yaralılara bakmam lazım. Evinde yaralı var mı? Varsa bana göster.',
            yes: 'Harika. Herkesi tek tek muayene edeceğim. Tek tek.', no: 'Hastalar beni bekliyor. Seni de bekleyeceğim.', talk: 'Nabzını ölçebilir miyim? Kalbin... çok güzel atıyor.' },
  cizgi:  { ad: 'Uzun Adam', look: { skin: '#d8ccc0', hair: '#0e0c0a', style: 'slick', shirt: '#1e1c22', tall: 1, suit: 1 }, v: 1, s: ['goz', 'koltuk'],
            who: 'Benim. Her zaman bendim.', why: 'Yalnız mısın? Evde başka kimse var mı? Söyle. Yalnız mısın?',
            yes: 'Güzel. Çok güzel bir ev.', no: 'Yalnız olduğunu biliyorum.', talk: '...' },
  baris:  { ad: 'Barış', look: { skin: '#c9a07c', hair: '#2a2418', style: 'buzz', shirt: '#4a5a32', army: 1 }, v: 0, s: ['goz'],
            who: 'Er Barış. Birliğim dağıldı.', why: 'Üç gündür uyumadım, gözlerim ondan böyle. Yemin ederim insanım.',
            yes: 'Sağ ol. Nöbeti ben tutarım istersen.', no: 'Anlaşıldı. Başka kapı denerim.', talk: 'Birlikte bir tane vardı... gülümsemesi hiç bozulmadı. Sonra herkesi...' },
  fikriye:{ ad: 'Fikriye', look: { skin: '#d8b498', hair: '#c8c4bc', style: 'scarf', scarf: '#6a4a7a', shirt: '#5a3a4a', old: 1 }, v: 0, s: [],
            who: 'Fikriye. Yan sokakta otururum. Kedimi arıyordum...', why: 'Kedim bulunmadı. Ben de kayboldum gibi oldu evladım.',
            yes: 'Sağ ol yavrum. Sana kek yapardım ama un kalmadı.', no: 'Peki... Kedimi görürsen içeri al bari.', talk: 'Kedim ziyaretçilere hep tıslardı. Keşke burada olsaydı.' },
  mert:   { ad: 'Mert', look: { skin: '#dcb898', hair: '#3a2a1c', style: 'short', shirt: '#2a4a6a', young: 1 }, v: 1, s: ['dis', 'tirnak', 'koltuk'],
            who: 'Mert, alt kat komşun. Hep selamlaşırız ya.', why: 'Benim dairede... bir şey var. Bende değil. Bende değil.',
            yes: 'Teşekkürler komşu. Komşuluk böyle olur.', no: 'Alt kattayım. Hep alt kattayım.', talk: 'Bu gece çok sessiz, değil mi? Kimse uyanmayacak gibi.' },
};
const NIGHTS = [null,
  { visits: ['remzi', 'selin', 'doruk'] },
  { visits: ['kadir', 'nilay', 'cizgi'] },
  { visits: ['baris', 'fikriye', 'mert'] },
];
const LAST = 3;

/* ---------- karakter çizimi ---------- */
function drawPerson(id, cx, cy, sc = 1, opt = {}) {
  const c = CHARS[id], L = c.look, k = sc * (L.kid ? .78 : L.tall ? 1.12 : 1), wrong = c.v && opt.wrong;
  seedFor(id.length * 31 + (opt.k || 0));
  const tilt = c.v ? Math.sin(performance.now() / 900) * .03 : 0;
  g.save(); g.translate(cx, cy); g.rotate(tilt);
  // gövde
  const sh = L.suit ? '#1e1c22' : L.shirt;
  rpoly([[-78 * k, 92 * k], [78 * k, 92 * k], [104 * k, 260 * k], [-104 * k, 260 * k]], sh);
  hatch(-104 * k, 92 * k, 208 * k, 168 * k, 9, 'rgba(0,0,0,.28)');
  if (L.suit) { rpoly([[-18 * k, 92 * k], [18 * k, 92 * k], [0, 150 * k]], '#e8e4dc', 2); rline(0, 100 * k, 0, 160 * k, 5 * k, '#0c0b0e'); }
  if (L.nurse) { rline(-30 * k, 120 * k, -30 * k, 150 * k, 4, '#c0302a'); rline(-45 * k, 135 * k, -15 * k, 135 * k, 4, '#c0302a'); }
  if (L.army) { for (let i = 0; i < 6; i++) rell(jt(150) * k, (120 + R() * 120) * k, 14 * k, 9 * k, '#3a4a26', 0); }
  // boyun + kafa
  rrect(-17 * k, 52 * k, 34 * k, 44 * k, L.skin, 2);
  if (L.style === 'long') rpoly([[-58 * k, -40 * k], [58 * k, -40 * k], [66 * k, 110 * k], [-66 * k, 110 * k]], L.hair);
  if (L.style === 'scarf') rpoly([[-66 * k, -30 * k], [66 * k, -30 * k], [74 * k, 96 * k], [-74 * k, 96 * k]], L.scarf);
  rell(0, 0, 50 * k, 62 * k, L.skin);
  // saç
  if (L.style === 'short' || L.style === 'messy' || L.style === 'buzz' || L.style === 'slick') {
    const hh = L.style === 'buzz' ? 18 : 30; rell(0, -40 * k, 52 * k, hh * k, L.hair, 2.4, INK, Math.PI, Math.PI * 2);
    if (L.style === 'messy') for (let i = 0; i < 7; i++) rline((-40 + i * 13) * k, -55 * k, (-44 + i * 13 + jt(10)) * k, -78 * k, 4, L.hair);
    if (L.style === 'slick') rline(-40 * k, -48 * k, 40 * k, -30 * k, 3, '#444');
  }
  if (L.style === 'long') rell(0, -38 * k, 54 * k, 34 * k, L.hair, 2.4, INK, Math.PI, Math.PI * 2);
  if (L.style === 'bun') { rell(0, -40 * k, 52 * k, 28 * k, L.hair, 2.4, INK, Math.PI, Math.PI * 2); rell(0, -70 * k, 20 * k, 16 * k, L.hair); rpoly([[-34 * k, -60 * k], [34 * k, -60 * k], [30 * k, -44 * k], [-30 * k, -44 * k]], '#fafafa', 2); }
  if (L.style === 'cap') { rell(0, -36 * k, 54 * k, 32 * k, L.cap, 2.4, INK, Math.PI, Math.PI * 2); rpoly([[-10 * k, -40 * k], [74 * k, -40 * k], [70 * k, -30 * k], [-10 * k, -32 * k]], L.cap); }
  if (L.style === 'scarf') { rell(0, -26 * k, 58 * k, 50 * k, L.scarf, 2.4, INK, Math.PI * 1.02, Math.PI * 1.98); for (let i = 0; i < 9; i++) rell(jt(90) * k, (-40 + R() * 30) * k, 3, 3, '#e8d8a0', 0); }
  // yüz
  const ey = -6 * k, red = wrong && c.s.includes('goz');

  for (const s of SIGN_ORDER) opts.push({ t: `🔍 ${SIGNS[s].check} (⚡1)`, dis: G.energy <= 0, f: () => {
    G.energy--; hud(); G.close = s; SND.look(); clearChoices();
    const has = c.s.includes(s);
    const msg = { goz: has ? 'Gözleri kıpkırmızı. Damarlar patlamış.' : 'Gözleri normal. Biraz yorgun.', dis: has ? 'Dişleri bembeyaz ve kusursuz. Tek bir çatlak, tek bir leke yok.' : 'Dişleri sararmış, biri biraz çarpık. Sıradan.', tirnak: has ? 'Tırnak altları kapkara.' : 'Tırnakları temiz.', koltuk: has ? 'Koltuk altında hiç kıl yok. Deri kızarmış, pul pul.' : 'Kıllı, sıradan bir koltuk altı. İğrenç ama insanca.' }[s];
    say('', msg + (G.known.includes(s) ? '' : '  (Bu işaret hakkında henüz bir şey duymadın.)'), () => { G.close = null; save(); inspectMenu(); });
  } });
  opts.push({ t: `🔫 Vur (${G.ammo})`, cls: 'red', dis: G.ammo <= 0, f: () => confirmShoot() });
  opts.push({ t: '← Geri', f: () => { G.insp = null; clearChoices(); roomMenu(); } });
  choices(opts);
}
function confirmShoot() {
  const id = G.insp, c = CHARS[id];
  choices([{ t: `Evet, ${c.ad}'i vur`, cls: 'red', f: () => {
    clearChoices(); G.ammo--; SND.shot(); flash = 1; shake = .6;
    G.guests = G.guests.filter(x => x !== id); G.shot.push(id);
    if (c.v) { setTimeout(() => SND.sting(), 300); say('', `${c.ad} yere yığıldı. Yüzü... yüzü eriyip kayıyor. Altındaki şey insan değildi.`, () => { G.insp = null; save(); roomMenu(); }); }
    else { G.karma -= 3; say('', `${c.ad} yere yığıldı. Kan kırmızıydı. Sıcaktı. ...O bir insandı.`, () => { G.insp = null; save(); roomMenu(); }); }
  } }, { t: 'Vazgeç', f: inspectMenu }]);
}
function finale() {
  const vis = G.guests.filter(id => CHARS[id].v), hum = G.guests.filter(id => !CHARS[id].v);
  setScene('hall'); SND.knock();
  sayMany([['', 'Üçüncü gecenin sonunda kapı çalındı. Bu sefer farklı: düzenli, sert vuruşlar.'], ['DIŞARIDAN', 'Kurtarma ekibi! Evde insan varsa kapıyı açın!']], () => {
    if (vis.length) ending('kotu', vis); else if (hum.length) ending('iyi', hum); else ending('yalniz');
  });
}
function ending(kind, list = []) {
  clearChoices(); setScene('end'); G.endGood = kind === 'iyi' || kind === 'yalniz';
  const names = list.map(id => CHARS[id].ad).join(', ');
  const T = {
    iyi: ['🌅 SABAH', `Kapıyı açtın. Ekip evdekileri tek tek kontrol etti: ${names}. Hepsi insan. Hepsi hayatta.${G.karma < 0 ? '<br><br>Ama kapıdan çevirdiklerini ve vurduklarını unutamayacaksın.' : ''}`],
    yalniz: ['🕯️ YALNIZ', 'Kapıyı açtın. Ekip boş evi gördü. Hayattaydın. Ama yanında kimse yoktu. Belki de en güvenlisi buydu.'],
    kotu: ['👁️ KAPIYI AÇMA', `Kapıyı açtığında arkandan bir ses geldi. ${names} gülümsüyordu. Kusursuz, bembeyaz dişlerle.<br><br>Kurtarma ekibi içeri girdiğinde evde kimse yoktu. İnsan olan kimse.`],
    yalniz_degil: ['👁️ SABAH OLMADI', 'Evde artık senden başka insan kalmamıştı. Gece yarısı salondan sesler geldi. Kapını çalan yoktu bu sefer; zaten içerideydiler.'],
  }[kind];
  localStorage.removeItem(SAVE);
  setTimeout(() => { kind === 'iyi' ? SND.door() : SND.sting();
    panel(`<h2>${T[0]}</h2><p>${T[1]}</p><p style="opacity:.7;font-size:.85em">Kurtulanlar: ${G.guests.filter(id => !CHARS[id].v).length} · Kaybedilenler: ${G.dead.length} · Vurulanlar: ${G.shot.length}</p><div class="row"><button class="btn" id="eMenu">Ana Menü</button><button class="btn" id="eAgain">Tekrar Oyna</button></div>`);
    $('eMenu').onclick = () => { hidePanel(); toTitle(); }; $('eAgain').onclick = () => { hidePanel(); startGame(fresh()); }; }, 600);
}
function toTitle() { G = null; $('title').classList.remove('hidden'); $('dlg').classList.add('hidden'); clearChoices(); hud(); $('tCont').disabled = !load(); }

/* ---------- menü ---------- */
$('tNew').onclick = () => { localStorage.removeItem(SAVE); startGame(fresh()); };
$('tCont').onclick = () => { const s = load(); if (s) startGame(s); };
$('tHow').onclick = () => { panel(`<h2>NASIL OYNANIR</h2><p style="text-align:left">🌙 <b>Gece</b> kapın çalınır. Gözetleme deliğinden bak, konuş, gülümsemesini ve gözlerini kontrol et. Sonra <b>içeri al</b> ya da <b>gönder</b>.<br>☀️ <b>Gündüz</b> televizyon yeni bir işaret söyler. Misafirlerine tıkla: konuş ya da enerji harcayıp incele. Emin olduğunda... tüfeğin var.<br>⚠️ Evde ziyaretçi varsa geceleri insanlar kaybolur. Üç gece dayan.</p><div class="row"><button class="btn" id="hOk">Tamam</button></div>`); $('hOk').onclick = hidePanel; };
$('tCont').disabled = !load();

/* ---------- tıklama (misafir seçimi) ---------- */
function toCanvas(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('mousemove', e => {
  if (!G || G.scene !== 'room' || G.phase !== 'day' || dlgQ) { if (G) G.hover = -1; cv.style.cursor = 'default'; return; }
  const [x, y] = toCanvas(e); G.hover = -1;
  G.guests.forEach((id, i) => { const [gx, gy] = guestPos(i, G.guests.length); if (Math.abs(x - gx) < 80 && y > gy - 70 && y < gy + 190) G.hover = i; });
  cv.style.cursor = G.hover >= 0 ? 'pointer' : 'default';
});
cv.addEventListener('click', () => { if (G && G.scene === 'room' && G.phase === 'day' && !dlgQ && G.hover >= 0) { SND.click(); openGuest(G.hover); } });

/* ---------- döngü ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  boil = Math.floor(now / 140);
  if (dlgQ && !dlgQ.done) { dlgQ.i = Math.min(dlgQ.text.length, dlgQ.i + dt * 48); $('dlg').querySelector('.tx').textContent = dlgQ.text.slice(0, Math.floor(dlgQ.i)); if (dlgQ.i >= dlgQ.text.length) dlgQ.done = true; }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0, setTimeout(() => toastT <= 0 && $('toast').classList.add('hidden'), 400); }
  flash = Math.max(0, flash - dt * 2.5); shake = Math.max(0, shake - dt * 1.6);
  const sc = G ? G.scene : 'title';
  if (sc === 'title' || !G) drawTitle(t);
  else if (sc === 'hall') drawHall(t);
  else if (sc === 'peep') drawPeep(t);
  else if (sc === 'room') drawRoom(t);
  else if (sc === 'tv') drawTV(t);
  else if (sc === 'inspect') drawInspect(t);
  else if (sc === 'end') drawEnd(t);
  overlay(t);
}
requestAnimationFrame(frame);
window.__ni = { get G() { return G; }, startGame, fresh, CHARS };
</script>
