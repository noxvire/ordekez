<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Karakterini Yarat — Ördekez</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Cinzel:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:#3b4262;background:radial-gradient(circle at 20% 0,#fff6e0,transparent 45%),linear-gradient(160deg,#e9edf8,#d9e0f2);overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,520px);gap:16px;padding:16px;max-width:1300px;margin:0 auto}
#stageCard{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 0 0 2px #d8c08a,0 0 0 5px rgba(255,255,255,.7),0 20px 50px rgba(60,70,120,.3);display:flex;flex-direction:column;min-height:0}
#top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px 0}
#top a{color:#fff;text-decoration:none;font-weight:900;background:rgba(40,50,90,.35);border:1px solid rgba(255,255,255,.6);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
#title{font:900 24px 'Cinzel',serif;letter-spacing:2px;margin:0;flex:1;color:#fff;text-shadow:0 2px 0 rgba(60,50,110,.45),0 0 14px rgba(255,230,160,.6)}
#nameIn{position:relative;z-index:2;margin:10px auto 0;display:block;width:min(260px,80%);text-align:center;font:800 17px Nunito;color:#3b4262;background:rgba(255,252,242,.92);border:2px solid #d8c08a;border-radius:999px;padding:7px 12px;outline:none;box-shadow:0 4px 12px rgba(60,50,110,.2)}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#sp{flex:1}
#ctrl{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:0 14px 16px}
.chip{border:2px solid rgba(216,192,138,.9);border-radius:999px;padding:7px 13px;font:900 14px Nunito;color:#3b4262;background:rgba(255,252,242,.92);cursor:pointer;transition:transform .1s;box-shadow:0 3px 8px rgba(60,50,110,.18)}
.chip:active{transform:scale(.95)}.chip.on{background:#3b4262;color:#f4dfa8;border-color:#f4dfa8}
.big{font-size:15px;padding:9px 18px}.go{background:linear-gradient(#fff4cf,#f4d58a);border-color:#c8a050}.rnd{background:#3b4262;color:#f4dfa8;border-color:#f4dfa8}
#panel{background:rgba(250,247,238,.94);border-radius:22px;box-shadow:0 0 0 2px #d8c08a,0 20px 50px rgba(60,70,120,.25);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#tabs{display:flex;gap:6px;padding:12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:#3b4262}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex-shrink:0;border:0;border-radius:12px;padding:7px 10px;min-width:62px;font:900 12px Nunito;color:#b8bdd8;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button i{font-style:normal;font-size:21px}
#tabs button.on{color:#3b4262;background:#f4dfa8;box-shadow:0 0 12px rgba(244,223,168,.6)}
#opts{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start}
.op{border:2px solid #e6dcc4;border-radius:12px;background:#fff;padding:5px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:800 12px Nunito;color:#5a6080;transition:transform .12s}
.op:hover{transform:translateY(-2px)}.op canvas{width:84px;height:84px;border-radius:8px}
.op.on{border-color:#d8a840;background:#fff8e2;color:#8a5a10;box-shadow:0 0 0 2px #f4dfa8,0 4px 12px rgba(216,168,64,.4)}
#colors{flex-shrink:0;border-top:2px solid #e6dcc4;padding:10px 12px 14px;max-height:38%;overflow:auto}
.cr{margin-bottom:8px}.cr b{display:block;font-size:13px;margin:0 0 5px 2px;color:#8a8aa8}
.sws{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(60,50,110,.3);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px #d8a840,0 2px 8px rgba(216,168,64,.6);transform:scale(1.14)}
.pick{position:relative;width:28px;height:28px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border:2px solid #fff;box-shadow:0 1px 4px rgba(60,50,110,.3);overflow:hidden}
.pick input{position:absolute;inset:-6px;opacity:0;cursor:pointer}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:#3b4262;border:2px solid #f4dfa8;color:#f4dfa8;font-weight:900;padding:10px 18px;border-radius:999px;transition:transform .35s cubic-bezier(.3,1.5,.5,1);z-index:9}
#toast.on{transform:translate(-50%,0)}
@media (max-width:820px){body{overflow:auto}#app{grid-template-columns:1fr;height:auto;padding:10px;gap:10px}#stageCard{height:62vh;min-height:380px}#opts{max-height:46vh;grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}.op canvas{width:70px;height:70px}#colors{max-height:none}#title{font-size:19px}}
@media (max-height:520px) and (orientation:landscape){#app{grid-template-columns:1fr 1.1fr;padding:8px;gap:8px}#title{font-size:16px}#nameIn{font-size:13px;padding:3px 8px;margin-top:4px}.chip{padding:4px 9px;font-size:12px}#ctrl{padding-bottom:8px;gap:5px}#tabs{padding:6px}#tabs button{min-width:50px;padding:4px 6px}#tabs button i{font-size:16px}.op canvas{width:58px;height:58px}#opts{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}#colors{max-height:40%}.sw,.pick{width:22px;height:22px}}
</style></head><body>
<div id="app">
  <div id="stageCard"><canvas id="cv"></canvas>
    <div id="top"><a href="index.html">←</a><h1 id="title">Karakterini Yarat</h1></div>
    <input id="nameIn" maxlength="16" placeholder="Karakterinin adı">
    <div id="sp"></div>
    <div id="ctrl">
      <button class="chip" data-r="-1">◀</button><button class="chip" data-r="1">▶</button>
      <button class="chip on" data-a="idle">🧍</button><button class="chip" data-a="walk">🚶</button><button class="chip" data-a="wave">👋</button><button class="chip" data-a="cheer">🙌</button><button class="chip" data-a="fish">🎣</button><button class="chip" data-a="sit">🪑</button>
      <button class="chip big rnd" id="rnd">🎲 Rastgele</button><button class="chip big go" id="save">✅ Kaydet</button>
    </div>
  </div>
  <div id="panel"><div id="tabs"></div><div id="opts"></div><div id="colors"></div></div>
</div>
<div id="toast">Karakterin kaydedildi! 🎉</div>
<script src="bk/kukla.js?v=2"></script>
<script>
const K = Kukla, C = K.COLORS, $ = id => document.getElementById(id);
let me = Object.assign({}, K.DEF); try { Object.assign(me, JSON.parse(localStorage.getItem('bk_kukla') || '{}')); } catch (e) {}
$('nameIn').value = me.ad || (localStorage.getItem('ordekez_user') || '');
const DIRS = ['s', 'e', 'n', 'w']; let di = 0, anim = 'idle', TABS, tab;
function buildTabs() {
  const kom = Object.fromEntries(K.kombinler()), kel = Object.assign({ yok: 'Kel' }, kom), yok = Object.assign({ yok: 'Yok' }, kom);
  TABS = [
    { k: 'cins', ic: '🧍', ad: 'Vücut', o: K.CINS, col: [], v: 'full' },
    { k: 'sac', ic: '💇', ad: 'Saç', o: kel, col: [['sacR', 'Saç rengi', C.sac]], v: 'head' },
    { k: 'gozT', ic: '👁️', ad: 'Göz', o: K.EYE, col: [['goz', 'Göz rengi', C.goz]], v: 'face' },
    { k: 'agiz', ic: '👄', ad: 'Ağız', o: K.MOUTH, col: [], v: 'face' },
    { k: 'ust', ic: '🧥', ad: 'Üst', o: yok, col: [['ustR', 'Üst rengi', C.giysi]], v: 'body' },
    { k: 'alt', ic: '👖', ad: 'Alt', o: yok, col: [['altR', 'Alt rengi', C.giysi]], v: 'legs' },
    { k: 'ayak', ic: '👢', ad: 'Ayakkabı', o: yok, col: [['ayakR', 'Ayakkabı rengi', C.giysi]], v: 'feet' },
    { k: 'kafa', ic: '👑', ad: 'Kafa', o: K.KAFA, col: [['kafaR', 'Renk', C.aks]], v: 'head' },
    { k: 'kulak', ic: '💎', ad: 'Küpe', o: K.KULAK, col: [['kulakR', 'Renk', C.aks]], v: 'face' },
    { k: 'yuz', ic: '🕶️', ad: 'Yüz', o: K.YUZ, col: [['yuzR', 'Renk', C.aks]], v: 'face' },
    { k: 'boyun', ic: '🧣', ad: 'Boyun', o: K.BOYUN, col: [['boyunR', 'Renk', C.aks]], v: 'body' },
    { k: 'sirt', ic: '🪽', ad: 'Sırt', o: K.SIRT, col: [['sirtR', 'Renk', C.aks]], v: 'full' },
    { k: 'kuyruk', ic: '🦊', ad: 'Kuyruk', o: K.KUYRUK, col: [['kuyrukR', 'Renk', C.aks]], v: 'full', dir: 'e' },
    { k: 'element', ic: '✨', ad: 'Element', o: K.ELEMENT, col: [], v: 'full' },
  ]; tab = TABS[0];
}
const cv = $('cv'), g = cv.getContext('2d');
function fit() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; }
addEventListener('resize', fit);
const CL = Array.from({ length: 6 }, () => ({ x: Math.random(), y: .08 + Math.random() * .3, s: .6 + Math.random() * .8, v: .004 + Math.random() * .006 }));
const SP = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), p: Math.random() * 6 }));
function cloud(x, y, s) { g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(x, y, 26 * s, 0, 7); g.arc(x + 30 * s, y - 12 * s, 32 * s, 0, 7); g.arc(x + 62 * s, y, 24 * s, 0, 7); g.rect(x, y, 62 * s, 24 * s); g.fill(); }
function stage(W, H, t) {
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#5a7ae8'); sky.addColorStop(.5, '#a8b8f8'); sky.addColorStop(.75, '#ffd8c0'); sky.addColorStop(1, '#ffe8d0'); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const k = W / 700; for (const c of CL) { c.x += c.v / 60; if (c.x > 1.2) c.x = -.3; cloud(c.x * W, c.y * H, c.s * k); }
  g.fillStyle = 'rgba(110,130,200,.35)'; g.beginPath(); g.moveTo(0, H * .7); g.quadraticCurveTo(W * .15, H * .52, W * .3, H * .66); g.quadraticCurveTo(W * .5, H * .56, W * .7, H * .68); g.quadraticCurveTo(W * .88, H * .5, W, H * .64); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  const gr = g.createLinearGradient(0, H * .72, 0, H); gr.addColorStop(0, '#9ad08a'); gr.addColorStop(1, '#5aa06a'); g.fillStyle = gr; g.beginPath(); g.moveTo(0, H * .78); g.quadraticCurveTo(W / 2, H * .7, W, H * .78); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  for (const p of SP) { const a = (Math.sin(t * 2 + p.p) + 1) / 2; g.globalAlpha = a * .9; g.fillStyle = '#fff'; g.save(); g.translate(p.x * W, p.y * H * .7); g.rotate(Math.PI / 4); g.fillRect(-2 * k, -2 * k, 4 * k, 4 * k); g.restore(); } g.globalAlpha = 1;
}
function frame() {
  const W = cv.width, H = cv.height, t = performance.now() / 1000; stage(W, H, t);
  const R = cv.getBoundingClientRect(), d = W / R.width, top = $('nameIn').getBoundingClientRect().bottom - R.top, bot = $('ctrl').getBoundingClientRect().top - R.top;
  const avail = (bot - top) * d, sc = Math.min(W / 520, avail / 760), cx = W / 2, cy = top * d + avail * .95;
  g.save(); g.translate(cx, cy); g.scale(1, .26); const ec = me.element !== 'yok' ? K.ELC[me.element] : '#f4dfa8';
  g.fillStyle = 'rgba(255,250,235,.75)'; g.beginPath(); g.arc(0, 0, 190 * sc, 0, 7); g.fill(); g.strokeStyle = '#d8b060'; g.lineWidth = 2 * d; g.beginPath(); g.arc(0, 0, 190 * sc, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, 160 * sc, 0, 7); g.stroke();
  g.shadowColor = ec; g.shadowBlur = 16; g.strokeStyle = ec; g.rotate(t * .4); for (let i = 0; i < 8; i++) { g.rotate(Math.PI / 4); g.beginPath(); g.moveTo(168 * sc, 0); g.lineTo(182 * sc, 12 * sc); g.lineTo(168 * sc, 24 * sc); g.stroke(); } g.restore();
  const h = K.draw(g, me, cx, cy, sc, { dir: DIRS[di], anim, t });
  if (anim === 'fish' && h) { const s = DIRS[di] === 'w' || DIRS[di] === 'n' ? -1 : 1, k = sc * 2.2; g.lineCap = 'round'; g.strokeStyle = '#6a4220'; g.lineWidth = 7 * sc; g.beginPath(); g.moveTo(h.hx - s * 14 * k, h.hy + 12 * k); g.quadraticCurveTo(h.hx + s * 60 * k, h.hy - 60 * k, h.hx + s * 120 * k, h.hy - 120 * k); g.stroke(); g.strokeStyle = '#e8c06a'; g.lineWidth = 2.5 * sc; g.stroke(); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 1.2 * d; g.beginPath(); g.moveTo(h.hx + s * 120 * k, h.hy - 120 * k); g.quadraticCurveTo(h.hx + s * 150 * k, h.hy, h.hx + s * 140 * k, h.hy + 80 * k); g.stroke(); }
  requestAnimationFrame(frame);
}
let dragX = null; cv.addEventListener('pointerdown', e => dragX = e.clientX); addEventListener('pointerup', () => dragX = null);
addEventListener('pointermove', e => { if (dragX == null) return; if (Math.abs(e.clientX - dragX) > 40) { di = (di + (e.clientX > dragX ? 3 : 1)) % 4; dragX = e.clientX; } });
document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => di = (di + 4 + +b.dataset.r) % 4);
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { anim = b.dataset.a; document.querySelectorAll('[data-a]').forEach(x => x.classList.toggle('on', x === b)); });
function tabs() { $('tabs').innerHTML = ''; TABS.forEach(T => { const b = document.createElement('button'); b.innerHTML = `<i>${T.ic}</i>${T.ad}`; b.classList.toggle('on', T === tab); b.onclick = () => { tab = T; tabs(); opts(); colors(); }; $('tabs').appendChild(b); }); }
const FR = { full: [800, .96, 0], head: [300, .5, 553], face: [190, .5, 512], body: [430, .5, 370], legs: [420, .5, 170], feet: [230, .62, 20] };
function thumb(c, cfg, T) { const x = c.getContext('2d'), w = c.width; const bg = x.createLinearGradient(0, 0, 0, w); bg.addColorStop(0, '#dfe6fb'); bg.addColorStop(1, '#fff3e2'); x.fillStyle = bg; x.fillRect(0, 0, w, w);
  const [span, fy, off] = FR[T.v] || FR.full, k = w / span; K.draw(x, cfg, w / 2, w * fy + off * k, k, { t: 1.3, dir: T.dir || 's' }); }
function opts() { const box = $('opts'); box.innerHTML = '';
  for (const [v, ad] of Object.entries(tab.o)) { const b = document.createElement('button'); b.className = 'op' + (me[tab.k] === v ? ' on' : ''); const c = document.createElement('canvas'); c.width = c.height = 168; b.appendChild(c); b.insertAdjacentHTML('beforeend', `<span>${ad}</span>`); thumb(c, Object.assign({}, me, { [tab.k]: v }), tab); b.onclick = () => { me[tab.k] = v; opts(); }; box.appendChild(b); }
  if (tab.k === 'sac' || tab.k === 'ust') box.insertAdjacentHTML('beforeend', `<div style="grid-column:1/-1;text-align:center;padding:8px;color:#8a8aa8;font-weight:800;font-size:12px">Yeni kombinler eklendikçe burada çoğalacak ✨</div>`); }
function colors() { const box = $('colors'); box.innerHTML = ''; box.style.display = tab.col.length ? '' : 'none';
  for (const [key, lbl, list] of tab.col) { const r = document.createElement('div'); r.className = 'cr'; r.innerHTML = `<b>${lbl}</b>`; const s = document.createElement('div'); s.className = 'sws';
    for (const c of list) { const b = document.createElement('button'); b.className = 'sw' + (me[key] === c ? ' on' : ''); if (c) b.style.background = c; else { b.style.background = 'conic-gradient(#2a2238 0 25%,#fff 0 50%,#2a2238 0 75%,#fff 0)'; b.title = 'Orijinal'; } b.onclick = () => { me[key] = c; colors(); opts(); }; s.appendChild(b); }
    const p = document.createElement('label'); p.className = 'pick'; const i = document.createElement('input'); i.type = 'color'; i.value = me[key] || '#888888'; i.oninput = () => { me[key] = i.value; }; i.onchange = () => { colors(); opts(); }; p.appendChild(i); s.appendChild(p); r.appendChild(s); box.appendChild(r); } }
const pick = a => a[Math.floor(Math.random() * a.length)], ks = o => Object.keys(o);
$('rnd').onclick = () => { const kom = K.kombinler().map(x => x[0]);
  Object.assign(me, { cins: pick(['e', 'k']), sac: pick(kom), sacR: pick(C.sac), ust: pick(kom), ustR: pick(C.giysi), alt: pick(kom), altR: pick(C.giysi), ayak: pick(kom), ayakR: pick(C.giysi), goz: pick(C.goz), gozT: pick(ks(K.EYE)), agiz: pick(ks(K.MOUTH)),
    kafa: Math.random() < .5 ? pick(ks(K.KAFA)) : 'yok', kafaR: pick(C.aks), kulak: Math.random() < .5 ? pick(ks(K.KULAK)) : 'yok', kulakR: pick(C.aks), yuz: Math.random() < .35 ? pick(ks(K.YUZ)) : 'yok', yuzR: pick(C.aks), boyun: Math.random() < .4 ? pick(ks(K.BOYUN)) : 'yok', boyunR: pick(C.aks), sirt: Math.random() < .35 ? pick(ks(K.SIRT)) : 'yok', sirtR: pick(C.aks), kuyruk: Math.random() < .35 ? pick(ks(K.KUYRUK)) : 'yok', kuyrukR: pick(C.aks), element: Math.random() < .6 ? pick(ks(K.ELEMENT).slice(1)) : 'yok' });
  anim = 'cheer'; setTimeout(() => anim === 'cheer' && (anim = 'idle'), 1200); opts(); colors(); };
$('save').onclick = () => { me.ad = $('nameIn').value.trim(); try { localStorage.setItem('bk_kukla', JSON.stringify(me)); } catch (e) {} $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1800); anim = 'cheer'; setTimeout(() => anim = 'idle', 1500); };
fit(); K.load('bk/').then(() => { buildTabs(); tabs(); opts(); colors(); frame(); });
</script></body></html>
